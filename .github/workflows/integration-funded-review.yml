name: Funded tier on a reviewed PR commit

# PR runs of ci.yml never get the testnet admin keys, so the Phoenix and FxDAO funded tests skip
# there. A maintainer who has reviewed a PR's head commit, fork or not, dispatches this with the PR
# number and that commit's SHA; the keys are released only after a required reviewer approves the
# testnet-funded-review environment, and only for that exact commit.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      sha:
        description: The reviewed head commit SHA (40 hex characters)
        required: true
        type: string

permissions: {}

jobs:
  resolve:
    name: resolve the reviewed commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Require the SHA to be the PR's current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          if ! [[ "$PR" =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "::error::pr must be a pull request number"
            exit 1
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [ "$head" != "$SHA" ]; then
            echo "::error::PR #$PR's head is $head, not the reviewed $SHA; review the new head and dispatch again"
            exit 1
          fi
          echo "Funded tier requested for PR #$PR at $SHA." >> "$GITHUB_STEP_SUMMARY"

  funded:
    name: integration (funded, reviewed commit)
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testnet-funded-review
    permissions:
      contents: read
    steps:
      # refs/pull/<n>/head exists in this repository for fork PRs too, so the reviewed commit is
      # fetched from here; a head that moved since review fails instead of running unreviewed code.
      - name: Check out the reviewed commit
        env:
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          git init -q .
          git fetch -q --no-tags --depth=1 "https://github.com/$REPO" "+refs/pull/$PR/head:refs/remotes/pr/head"
          fetched=$(git rev-parse refs/remotes/pr/head)
          if [ "$fetched" != "$SHA" ]; then
            echo "::error::PR #$PR's head moved to $fetched after review of $SHA"
            exit 1
          fi
          git checkout -q --detach "$SHA"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run funded integration tests
        env:
          LUMENWIPE_INTEGRATION_FUNDED: "1"
          STELLAR_RPC_TESTNET: https://soroban-rpc.testnet.stellar.gateway.fm,https://soroban-testnet.stellar.org
          PHOENIX_TESTNET_TOKEN_ADMIN_SECRET: ${{ secrets.PHOENIX_TESTNET_TOKEN_ADMIN_SECRET }}
          FXDAO_TESTNET_ORACLE_ADMIN_SECRET: ${{ secrets.FXDAO_TESTNET_ORACLE_ADMIN_SECRET }}
          PATH_ROUTING_API_TESTNET: https://horizon-testnet.stellar.org
        run: |
          bun run --filter '@lumenwipe/api' test:integration ||
            bun run --filter '@lumenwipe/api' test:integration
