name: e2e (testnet)

# The end-to-end suite is the only automated coverage of the full irreversible close path, and
# it cannot run on pull requests: it drives live testnet, funds accounts through friendbot, and
# takes ten-plus minutes. Leaving it out of CI entirely is what let five specs sit broken for
# days after #95 moved the source-address field, with nothing to say so - so it runs nightly
# instead, and a failure opens an issue rather than sitting in a tab nobody opens.

on:
  schedule:
    # 07:00 UTC daily - after Europe's morning, before the Americas start.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-testnet
  cancel-in-progress: false

permissions: {}

jobs:
  e2e:
    name: close flow against testnet
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.suite.outcome }}
    # Run 42844639885 took 31.2 minutes for 69 tests on two workers, including `retries: 2`
    # spent on 3 failed and 5 flaky tests, so 90 leaves room for a much slower night. A kill
    # here is reported as a plain failure with no artifact, which is indistinguishable from the
    # close path actually breaking.
    timeout-minutes: 90
    # Chromium, its system libraries and fonts come in the image, so a run never depends on the
    # Ubuntu package mirrors, which failed every install on 2026-11-11.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-bun extracts a zip and the image has no unzip; its Node installs Bun instead.
      - run: npm install -g bun@1.4.4

      - run: bun install --frozen-lockfile

      # A no-op while the image matches the locked Playwright; after a lockfile-only bump it
      # downloads the newer Chromium from Playwright's CDN, still without apt.
      - name: Install Playwright browser
        run: bunx playwright install chromium
        working-directory: apps/web

      - name: Run the suite
        id: suite
        working-directory: apps/web
        env:
          # Public testnet endpoints. No secret is needed for the paths under test: the
          # exchange/mediator flow needs a server-side mediator key and runs in the nightly SDK
          # example (sdk-example-nightly.yml) with a per-run testnet key, so nothing here signs
          # on behalf of an operator-held account.
          # Gateway first: SDF's endpoint stalls for seconds on a share of calls, which an
          # analyze of ~40 reads cannot absorb. SDF stays as the failover.
          STELLAR_RPC_TESTNET: https://soroban-rpc.testnet.stellar.gateway.fm,https://soroban-testnet.stellar.org
          PATH_ROUTING_API_TESTNET: https://horizon-testnet.stellar.org
          # API_KEYS is a label=key map, so the key the API accepts is everything after the
          # first `=`. Both sides must therefore carry the same string, not the same shape.
          API_KEYS: ci=${{ github.run_id }}-e2e
          LUMENWIPE_API_URL: http://localhost:3001
          LUMENWIPE_API_KEY: ${{ github.run_id }}-e2e
        # The local API's Nest log is in this step's output, each line prefixed [WebServer]:
        # playwright.config.ts pipes the API's stdout in CI. A 503 the page reports as
        # "temporarily unavailable" has a matching "upstream read failed" line naming the target.
        run: bun run --filter '@lumenwipe/web' test:e2e

      # Always, not only on failure: a green run that mostly skipped is the outcome worth
      # inspecting, and it is invisible without the report. Three specs call test.skip() on
      # live testnet conditions (no USDC liquidity, no strict-send route), and a skip does not
      # fail the job - so "green" can mean the conversion and claim paths never ran at all.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 30
          if-no-files-found: warn

  # The playground's suite (apps/playground/tests/e2e): the standard recipe end to end through the
  # real API, and the plain-language error copy. Its own job so a playground failure never reads
  # as the close path breaking. No secret: tests/e2e/serve.ts creates the playground's issuer and
  # market maker per run through Friendbot, with a fresh encryption key, and the API key below is
  # scoped to this run. The hosted playground's accounts are never used.
  playground:
    name: playground against testnet
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.suite.outcome }}
    # Run 42844639885 (23 tests) ran into Playwright's globalTimeout (80 minutes in CI) at 1.3 h:
    # six failures each spent their 6-minute wait twice under `retries: 1`, about 72 minutes, and
    # 13 tests never ran. A healthy run has not been measured yet. The globalTimeout ends the run
    # before this limit, so a slow night is a failure with a report, not a kill here that the
    # report job below reads as cancelled and never files.
    timeout-minutes: 90
    # Chromium, its system libraries and fonts come in the image, so a run never depends on the
    # Ubuntu package mirrors, which failed every install on 2026-11-11.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-bun extracts a zip and the image has no unzip; its Node installs Bun instead.
      - run: npm install -g bun@1.4.4

      - run: bun install --frozen-lockfile

      # A no-op while the image matches the locked Playwright; after a lockfile-only bump it
      # downloads the newer Chromium from Playwright's CDN, still without apt.
      - name: Install Playwright browser
        run: bunx playwright install chromium
        working-directory: apps/playground

      - name: Run the suite
        id: suite
        working-directory: apps/playground
        env:
          # Gateway first: SDF's endpoint stalls for seconds on a share of calls. SDF stays as the failover.
          STELLAR_RPC_TESTNET: https://soroban-rpc.testnet.stellar.gateway.fm,https://soroban-testnet.stellar.org
          PATH_ROUTING_API_TESTNET: https://horizon-testnet.stellar.org
          # Its own label, as the hosted playground has; the key is everything after the first `=`.
          API_KEYS: playground=${{ github.run_id }}-playground
          LUMENWIPE_API_URL: http://localhost:3001
          LUMENWIPE_API_KEY: ${{ github.run_id }}-playground
        run: bun run --filter '@lumenwipe/playground' test:e2e

      # Always, for the same reason as the web suite's report. No spec reads the credentials
      # route, so the report and traces hold no demo secret.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-playwright-report
          path: |
            apps/playground/playwright-report/
            apps/playground/test-results/
          retention-days: 30
          if-no-files-found: warn

  # A red run in the Actions tab is the same as no signal at all if nobody is looking, which is
  # the state this workflow exists to fix. A failure becomes an issue; a later green run closes
  # it, so a flaky night does not leave a stale one behind. One tracker per suite, so a playground
  # failure is never filed as the close path failing; the web suite's title, labels and assignee
  # are the ones this job has always used.
  report:
    name: open an issue on failure (${{ matrix.suite }})
    needs: [e2e, playground]
    # Manual runs report too. Gating this on `schedule` meant the run you would actually use to
    # confirm a fix could not close the issue, and left the whole reporting path impossible to
    # exercise except by waiting for a 07:00 UTC failure.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: web
            job: e2e
            name: Nightly e2e
            assignee: miguelnietoa
            failed: The nightly end-to-end suite failed against testnet.
            meaning: |-
              This suite is the only automated coverage of the full irreversible close path, so a
              failure here means that path is unverified until it is fixed - it does not mean the
              tests are wrong. Testnet flakiness is possible; download the playwright-report
              artifact from the run above before assuming either.
          - suite: playground
            job: playground
            name: Nightly playground e2e
            assignee: salazarsebas
            failed: The nightly playground end-to-end suite failed against testnet.
            meaning: |-
              The playground's full cycle (create, mess, demolish through the real API, merge) or
              its plain-language error copy is broken, so the demo may be failing for visitors.
              Testnet flakiness is possible; download the playground-playwright-report artifact
              from the run above before assuming either.
    steps:
      - name: Open or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs[matrix.job].result }}
          SUITE: ${{ needs[matrix.job].outputs.suite }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NAME: ${{ matrix.name }}
          ASSIGNEE: ${{ matrix.assignee }}
          FAILED: ${{ matrix.failed }}
          MEANING: ${{ matrix.meaning }}
        run: |
          set -euo pipefail
          TITLE="$NAME is failing against testnet"

          # Exact title match against the list endpoint, not `--search ... in:title`. That
          # qualifier tokenizes, so an unrelated open issue mentioning these words could be
          # commented on - or closed as "green again" - and it reads a search index that lags
          # issue creation by minutes, which duplicates the tracker. `|| true` because a
          # transient API error here must not abort the job and swallow the whole report.
          EXISTING=$(gh issue list --repo "$REPO" --state open --limit 200 --json number,title 2>/dev/null \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty' || true)

          # Only a real failure opens an issue. `needs.<job>.result` is also `cancelled` and
          # `skipped` - a queued run superseded by a newer one, or a human stopping a hung job -
          # and reporting those as "the close path is unverified" is the noise that trains
          # people to ignore the tracker.
          if [ "$RESULT" != "failure" ]; then
            if [ "$RESULT" = "success" ] && [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$REPO" --body "$NAME is green again: $RUN_URL"
              gh issue close "$EXISTING" --repo "$REPO" --reason completed
            fi
            exit 0
          fi

          # A failure before the suite ran (runner network, image pull, bun install) says nothing
          # about LumenWipe, so it stays a red run and never opens or comments on the tracker.
          if [ "$SUITE" != "failure" ]; then
            echo "::warning::$NAME failed before its suite ran; no issue filed: $RUN_URL"
            exit 0
          fi

          BODY=$(printf '%s\n' \
            "$FAILED" \
            "" \
            "Run: $RUN_URL" \
            "" \
            "$MEANING" \
            "" \
            "This issue closes itself on the next green run, including a manual one from the" \
            "Actions tab - so a fix can be confirmed without waiting for 07:00 UTC.")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "Still failing: $RUN_URL"
          else
            # Assigned, not just labelled: an unassigned issue in the backlog is the same
            # "nobody is looking" failure this workflow exists to fix, one level removed.
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" \
              --label bug --label area:web --assignee "$ASSIGNEE"
          fi
