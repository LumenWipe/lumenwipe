name: Deploy API (Cloud Run)

# Runs on merge to main. main is branch-protected (requires the CI check), so a
# commit reaching main is already CI-green. Also triggerable by hand.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json" # root workspace config affects the image
      - "tsconfig.base.json" # copied into the builder; affects compilation
      - "bun.lock"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions: {}

env:
  SERVICE: lumenwipe-api
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  REGION: ${{ vars.GCP_REGION }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/lumenwipe-api:${{ github.sha }}

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # required for keyless auth (Workload Identity Federation)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud (keyless / WIF)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          # Cloud Run needs a plain linux/amd64 image manifest: --provenance=false
          # avoids BuildKit's OCI image-index + attestation manifest that Cloud Run rejects.
          docker build --platform linux/amd64 --provenance=false -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      # Deploys a new revision from the image. Resource flags below are applied;
      # env vars and Secret Manager bindings are set once on the service (see the
      # runbook) and inherited by each new revision, so they're not repeated here.
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2.7.6
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --min-instances=0
            --max-instances=1
            --cpu=1
            --memory=512Mi
            --execution-environment=gen1
            --cpu-boost

      - run: echo "Deployed ${SERVICE} -> ${{ steps.deploy.outputs.url }}"
