name: Deploy API (Cloud Run)

# Runs on merge to main. main is branch-protected (requires the CI check), so a
# commit reaching main is already CI-green. Also triggerable by hand.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json" # root workspace config affects the image
      - "tsconfig.base.json" # copied into the builder; affects compilation
      - "bun.lock"
      - ".github/workflows/deploy-api.yml"
      - "scripts/deploy-api.sh"
  workflow_dispatch:
    inputs:
      drill:
        description: "fail-smoke forces the candidate's smoke test to fail, to prove it never takes traffic"
        type: choice
        options: [none, fail-smoke]
        default: none

permissions: {}

env:
  SERVICE: lumenwipe-api
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  REGION: ${{ vars.GCP_REGION }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/lumenwipe-api:${{ github.sha }}

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    # Production deploys only from main, whatever ref a manual run is started on.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write # required for keyless auth (Workload Identity Federation)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (keyless / WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          # Cloud Run needs a plain linux/amd64 image manifest: --provenance=false
          # avoids BuildKit's OCI image-index + attestation manifest that Cloud Run rejects.
          # The SBOM is written by Syft in the steps below instead of as a BuildKit attestation,
          # so the pushed manifest stays the plain one.
          docker build --platform linux/amd64 --provenance=false --build-arg GIT_SHA="$GITHUB_SHA" -f apps/api/Dockerfile -t "$IMAGE" .

      # Every deployed image is inventoried: the SBOM is written from the image just built, before it
      # is pushed, and a failure here stops the deploy rather than shipping an image with no record.
      # Syft comes from main's Actions cache (ci.yml, release binary cache). No vulnerability gate
      # here: CI already scanned this commit, and an advisory published since must not block a fix.
      - name: Read the Syft pin
        id: pins
        run: |
          {
            echo "syft-version=$(jq -er .syft.version scripts/security-tools.json)"
            echo "syft-sha256=$(jq -er .syft.linuxSha256 scripts/security-tools.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Install Syft
        uses: ./.github/actions/release-binary
        with:
          name: syft
          version: ${{ steps.pins.outputs.syft-version }}
          sha256: ${{ steps.pins.outputs.syft-sha256 }}
          url: https://github.com/anchore/syft/releases/download/v${{ steps.pins.outputs.syft-version }}/syft_${{ steps.pins.outputs.syft-version }}_linux_amd64.tar.gz
          member: syft

      - name: Write the SBOM
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          mkdir -p image-report
          ./syft scan "docker:${IMAGE}" --quiet -o spdx-json=image-report/sbom.spdx.json

      - name: Push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker push "$IMAGE"
          # The registry digest is what Cloud Run resolves the tag to, so it is what the SBOM describes.
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"
          echo "$digest" > image-report/digest.txt
          echo "Pushed \`${digest}\`; its SBOM is the api-image-sbom-${GITHUB_SHA} artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-image-sbom-${{ github.sha }}
          path: image-report/
          retention-days: 90
          if-no-files-found: error

      # Deploys the image as a revision with no traffic, smoke tests it on its tagged URL and only
      # then promotes it; see RELEASING.md (apps/api) for each outcome and the manual rollback.
      # Env vars and Secret Manager bindings are set once on the service and inherited by each
      # new revision, so they are not repeated here.
      - name: Deploy to Cloud Run
        timeout-minutes: 20
        env:
          DRILL: ${{ inputs.drill }}
          API_SMOKE_KEY: ${{ secrets.API_SMOKE_KEY }}
        run: scripts/deploy-api.sh deploy

      # A deploy killed mid-way (cancelled or timed out) cannot finish its own rollback or restore.
      - name: Recover an interrupted deploy
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 10
        run: scripts/deploy-api.sh recover
