name: on-chain monitors

# The ledger watchers from docs/monitoring-plan.md. Scheduled rather than on push: a check that
# only fires when someone opens a pull request is not monitoring. Read-only, no secret except the
# alert webhook.

on:
  schedule:
    # Service-account checks every hour; a leaked key must not wait for tomorrow.
    - cron: "0 0-5,7-23 * * *"
    # The daily run adds the registry comparison, an hour before the nightly e2e.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: onchain-monitors
  cancel-in-progress: false

# Read-only by default; only `report` writes, and it says so itself.
permissions:
  contents: read

env:
  # Every service account with a signing key, by network. Testnet only until the mainnet mediator
  # and sponsor are deployed: adding them is one entry each. The mediator floor is its base
  # reserve; the sponsor floor is a provisional top-up level until real usage sets one.
  SERVICE_ACCOUNTS: >-
    [
      {"role":"mediator","network":"testnet","address":"GC2VH6XP7HTOZHIX4OC3PU5HUXWY5XANGML4F6GBCNH5MBDFN5MU4WG7","floorXlm":"1"},
      {"role":"sponsor","network":"testnet","address":"GCMCGC6EJZKJJUTFY6RK43PGOODW6EL6FSHSLXBV4EYSZ3GHNJO3FXAP","floorXlm":"50"}
    ]

jobs:
  registry:
    name: registry hashes still match mainnet
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - name: Compare every verifiedLive mainnet entry against the ledger
        working-directory: apps/api
        env:
          LUMENWIPE_RUN_INTEGRATION: "1"
        run: bun test tests/integration/mainnet-registry.integration.test.ts

  service-keys:
    name: service keys have not signed anything
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Look for transactions sourced from a service account
        run: |
          set -euo pipefail
          fail=0

          # The sponsor pays fees, so it appears as fee_account and the user's account is always
          # the source. The mediator co-signs a forward it never originates. Either one sourcing
          # a transaction means the key signed something this codebase did not build. Baseline
          # measured 2026-09-18: 0 for both.
          while IFS=$'\t' read -r role network account; do
            case "$network" in
              mainnet) horizon=https://horizon.stellar.org ;;
              testnet) horizon=https://horizon-testnet.stellar.org ;;
              *) echo "::error::unknown network $network"; exit 1 ;;
            esac

            code=$(curl -sS -o /tmp/txs.json -w '%{http_code}' \
              "$horizon/accounts/$account/transactions?limit=200&order=desc")

            # An endpoint problem must fail loudly, never read as "nothing to report".
            if [ "$code" != "200" ]; then
              echo "::error::Horizon returned $code for the $role ($network) account. The check did not run."
              fail=1
              continue
            fi

            sourced=$(jq -r --arg a "$account" \
              '[._embedded.records[] | select(.source_account == $a)] | length' /tmp/txs.json)

            if [ "$sourced" != "0" ]; then
              echo "::error::The $role ($network) key sourced $sourced transaction(s). Expected 0."
              jq -r --arg a "$account" \
                '._embedded.records[] | select(.source_account == $a) | "  \(.created_at)  \(.hash)"' \
                /tmp/txs.json
              fail=1
            else
              echo "$role ($network, $account): 0 transactions sourced from it, as expected."
            fi
          done < <(jq -r '.[] | [.role, .network, .address] | @tsv' <<< "$SERVICE_ACCOUNTS")

          exit "$fail"

  balances:
    name: service accounts are above their balance floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - working-directory: apps/api
        run: bun run scripts/monitors/service-accounts.ts balances

  mediator-forward:
    name: the mediator never paid out more than a merge delivered
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - working-directory: apps/api
        run: bun run scripts/monitors/service-accounts.ts forward

  report:
    name: open an issue and alert on failure
    needs: [registry, service-keys, balances, mediator-forward]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or close the tracking issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REGISTRY: ${{ needs.registry.result }}
          KEYS: ${{ needs.service-keys.result }}
          BALANCES: ${{ needs.balances.result }}
          FORWARD: ${{ needs.mediator-forward.result }}
          HOURLY: ${{ github.event.schedule == '0 0-5,7-23 * * *' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="An on-chain monitor is reporting a finding"

          # Exact title match, not `--search ... in:title`: that qualifier tokenizes and lags, so
          # it can comment on or close an unrelated issue. See e2e-nightly.yml.
          EXISTING=$(gh issue list --repo "$REPO" --state open --limit 200 --json number,title 2>/dev/null \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty' || true)

          STATUS=$(printf '%s\n' \
            "- registry hashes still match mainnet: $REGISTRY" \
            "- service keys have not signed anything: $KEYS" \
            "- service accounts are above their balance floor: $BALANCES" \
            "- the mediator never paid out more than a merge delivered: $FORWARD")

          # `cancelled` and `skipped` are a superseded run, a human stopping a job, or the hourly
          # run leaving the registry to the daily one: not findings.
          if [ "$REGISTRY" != "failure" ] && [ "$KEYS" != "failure" ] \
             && [ "$BALANCES" != "failure" ] && [ "$FORWARD" != "failure" ]; then
            if [ "$REGISTRY" = "success" ] && [ "$KEYS" = "success" ] \
               && [ "$BALANCES" = "success" ] && [ "$FORWARD" = "success" ] && [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$REPO" --body "All monitors are clean again: $RUN_URL"
              gh issue close "$EXISTING" --repo "$REPO" --reason completed
              echo "alert=recovered" >> "$GITHUB_OUTPUT"
              echo "issue=$EXISTING" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          BODY=$(printf '%s\n' \
            "An on-chain monitor failed. Run: $RUN_URL" \
            "" \
            "$STATUS" \
            "" \
            "What each failure means, and what to do:" \
            "https://docs.lumenwipe.com/monitoring-plan#5-what-happens-when-an-alert-fires" \
            "(docs/monitoring-plan.md, section 5)." \
            "" \
            "A registry failure means a protocol redeployed. Exits against that contract already" \
            "halt at the registry gate, so this is not an emergency: re-verify the contract" \
            "against the protocol's own release, update the entry, and re-run the integration" \
            "suite before exits resume." \
            "" \
            "A balance failure means a service account dropped below its floor: check what" \
            "drained it before topping it up, and compare with the mediator's own transactions." \
            "" \
            "A service-key or mediator-forward failure is different. It means a key the API holds" \
            "signed a transaction this codebase did not build, or the mediator paid out of its own" \
            "balance. Treat it as a suspected key compromise: rotate the key and audit every" \
            "transaction it signed or paid for." \
            "" \
            "This issue closes itself on the next clean daily run, including a manual one from the" \
            "Actions tab.")

          # A key compromise is re-announced every hour it persists; a registry or balance
          # finding gets one alert, then one daily comment, so the channel stays readable.
          CRITICAL=no
          if [ "$KEYS" = "failure" ] || [ "$FORWARD" = "failure" ]; then CRITICAL=yes; fi

          if [ -n "$EXISTING" ]; then
            if [ "$HOURLY" != "true" ]; then
              gh issue comment "$EXISTING" --repo "$REPO" --body "Still reporting: $RUN_URL"
            fi
            if [ "$CRITICAL" = "yes" ]; then echo "alert=finding" >> "$GITHUB_OUTPUT"; fi
            echo "issue=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            NEW=$(gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" \
              --label security --assignee miguelnietoa)
            echo "alert=finding" >> "$GITHUB_OUTPUT"
            echo "issue=${NEW##*/}" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "status<<EOF"
            echo "$STATUS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Alert the maintainers' channel
        if: steps.issue.outputs.alert != ''
        env:
          WEBHOOK: ${{ secrets.DISCORD_MONITORS_WEBHOOK_URL }}
          ALERT: ${{ steps.issue.outputs.alert }}
          STATUS: ${{ steps.issue.outputs.status }}
          ISSUE_URL: ${{ github.server_url }}/${{ github.repository }}/issues/${{ steps.issue.outputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # A finding with nowhere to go is itself a finding: the issue above still exists, but
          # the run must show that nobody was paged.
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DISCORD_MONITORS_WEBHOOK_URL is not set; the alert was not delivered."
            exit 1
          fi

          if [ "$ALERT" = "recovered" ]; then
            CONTENT=$(printf '%s\n' "✅ All on-chain monitors are clean again." "Run: $RUN_URL")
          else
            CONTENT=$(printf '%s\n' "🚨 An on-chain monitor is reporting a finding." "$STATUS" \
              "What to do: https://docs.lumenwipe.com/monitoring-plan#5-what-happens-when-an-alert-fires (docs/monitoring-plan.md, section 5)" \
              "Issue: $ISSUE_URL" "Run: $RUN_URL")
          fi

          code=$(jq -n --arg c "$CONTENT" '{content: $c}' \
            | curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d @- "$WEBHOOK")
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::error::Discord returned $code; the alert was not delivered."
            exit 1
          fi
