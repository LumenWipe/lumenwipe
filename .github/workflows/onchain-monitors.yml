name: on-chain monitors

# The ledger watchers from docs/monitoring-plan.md. Scheduled rather than on push: a check that
# only fires when someone opens a pull request is not monitoring. Read-only, no secret except the
# alert webhook.

on:
  schedule:
    # Every check every hour: a leaked key or an upgraded contract must not wait for tomorrow.
    # GitHub runs scheduled workflows on a best-effort basis and drops many of the hourly ones
    # (docs/monitoring-plan.md has the measurement), so these two lines are the fallback. An
    # external scheduler is planned to start this workflow every hour with `cadence=hourly`.
    - cron: "0 0-5,7-23 * * *"
    # The same checks. Its own line so the report can tell the one run a day that comments on an
    # open issue from the event itself, which a delayed run still carries.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      cadence:
        description: >-
          What the run means. hourly: the hourly run (no comment on an open issue). daily: the
          06:00 run (comments once on an open issue). manual: a person's run (comments).
        type: choice
        options:
          - manual
          - hourly
          - daily
        default: manual
        required: false

# Two triggers close together run one after the other. A third run that arrives while one is
# running and one is waiting replaces the waiting one (GitHub cancels it), which is harmless for
# identical checks; a replaced daily run only skips that day's comment.
concurrency:
  group: onchain-monitors
  cancel-in-progress: false

# Nothing by default; each job asks for what it needs, and only `report` writes.
permissions: {}

env:
  # The service accounts to watch, one repository variable per role and network, read nowhere
  # else: a key rotation edits one variable and the matching row of docs/monitoring-plan.md, and
  # the config step fails until both agree. A network with no variable set is not watched; a
  # variable the plan expects that is unset fails the run.
  MEDIATOR_ADDRESS_TESTNET: ${{ vars.MEDIATOR_ADDRESS_TESTNET }}
  FEE_ACCOUNT_ADDRESS_TESTNET: ${{ vars.FEE_ACCOUNT_ADDRESS_TESTNET }}
  MEDIATOR_ADDRESS_MAINNET: ${{ vars.MEDIATOR_ADDRESS_MAINNET }}
  FEE_ACCOUNT_ADDRESS_MAINNET: ${{ vars.FEE_ACCOUNT_ADDRESS_MAINNET }}
  # The address a rotation drained, kept for 24 hours by the rotation runbooks: read by the keys
  # and forward checks only, never compared with the plan. Unset when no rotation is in progress.
  MEDIATOR_ADDRESS_TESTNET_RETIRED: ${{ vars.MEDIATOR_ADDRESS_TESTNET_RETIRED }}
  FEE_ACCOUNT_ADDRESS_TESTNET_RETIRED: ${{ vars.FEE_ACCOUNT_ADDRESS_TESTNET_RETIRED }}
  MEDIATOR_ADDRESS_MAINNET_RETIRED: ${{ vars.MEDIATOR_ADDRESS_MAINNET_RETIRED }}
  FEE_ACCOUNT_ADDRESS_MAINNET_RETIRED: ${{ vars.FEE_ACCOUNT_ADDRESS_MAINNET_RETIRED }}
  # The account a rotation drains a retired address into, held to its row of the plan like the
  # addresses above. The forward check reads that merge, in a transaction the operator sourced,
  # as the drain rather than a payout.
  OPERATOR_ADDRESS_TESTNET: ${{ vars.OPERATOR_ADDRESS_TESTNET }}
  OPERATOR_ADDRESS_MAINNET: ${{ vars.OPERATOR_ADDRESS_MAINNET }}
  # How many hours of history the keys and forward checks read; unset means 168.
  MONITOR_HISTORY_HOURS: ${{ vars.MONITOR_HISTORY_HOURS }}

jobs:
  # The one place that decides whether a run is the hourly one. It reads the event only through
  # env, refuses a value it does not know before any check runs (the API may not validate a
  # `choice` input), and the report reads its output instead of the event.
  cadence:
    name: which run this is
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      hourly: ${{ steps.decide.outputs.hourly }}
    steps:
      - name: Decide hourly or not
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CADENCE: ${{ inputs.cadence }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              "0 0-5,7-23 * * *") hourly=true ;;
              "0 6 * * *") hourly=false ;;
              *)
                echo "::error::Unknown schedule '$SCHEDULE'; add it to the cadence step."
                exit 1
                ;;
            esac
          else
            # A manual run keeps its meaning: it comments on an open issue every time.
            case "${CADENCE:-manual}" in
              hourly) hourly=true ;;
              daily | manual) hourly=false ;;
              *)
                echo "::error::Unknown cadence input; use manual, hourly or daily."
                exit 1
                ;;
            esac
          fi
          echo "hourly=$hourly" >> "$GITHUB_OUTPUT"

  registry:
    name: registry hashes still match mainnet
    needs: cadence
    runs-on: ubuntu-latest
    # About 2 minutes of setup, then at most 2 minutes of a first run that is retried, the
    # minute's pause and 4 minutes of second run. A first run that took longer is not retried.
    timeout-minutes: 10
    permissions:
      contents: read
    # What a failed comparison reported: `finding` for a mismatch, `incomplete` for a read the
    # RPC did not answer. Empty when it passed, crashed or timed out.
    outputs:
      status: ${{ steps.compare.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - run: bun install --frozen-lockfile

      - name: Compare every verifiedLive mainnet entry against the ledger
        id: compare
        working-directory: apps/api
        env:
          LUMENWIPE_RUN_INTEGRATION: "1"
          REGISTRY_STATUS_FILE: ${{ runner.temp }}/registry-status
        run: |
          set -uo pipefail
          compare() {
            rm -f "$REGISTRY_STATUS_FILE"
            "$@" bun test tests/integration/mainnet-registry.integration.test.ts
          }
          reported() { cat "$REGISTRY_STATUS_FILE" 2>/dev/null || true; }

          code=0
          compare || code=$?
          # One more try for a read the public RPC did not answer, so a blip does not open an
          # issue every hour. A mismatch is never retried, and the second run is the result.
          if [ "$code" -ne 0 ] && [ "$(reported)" = "incomplete" ] && [ "$SECONDS" -lt 120 ]; then
            echo "::warning::incomplete read; comparing once more in 60 seconds"
            sleep 60
            code=0
            compare timeout 240 || code=$?
          fi
          if [ "$code" -ne 0 ]; then echo "status=$(reported)" >> "$GITHUB_OUTPUT"; fi
          exit "$code"

  service-accounts:
    name: service accounts
    needs: cadence
    runs-on: ubuntu-latest
    # Each check ends on its own and reports what it could not read (scripts/monitors): keys reads
    # every account record at once (30 s at most) and then history within a 4-minute budget,
    # forward reads within 4 minutes, and balances is one request per current account (30 s each,
    # 2 minutes for four, also capped at 4). With about 2 minutes of setup, the worst case is about
    # 2 + 4.5 + 2 + 4 = 12.5 minutes. A job timeout loses the statuses and reads as an incomplete
    # read, so the limit leaves room above that.
    timeout-minutes: 20
    permissions:
      contents: read
    # The report reads each check from these. Anything but `success`, an empty value included,
    # is a finding there. A failing check fails its step and this job, so the run shows it red;
    # each check still runs after another one failed, and none runs after a config failure.
    # The keys and forward checks also say whether they found something or could not read
    # everything; only `finding` pages everyone, and a step that never said either does not.
    outputs:
      config: ${{ steps.config.outcome }}
      keys: ${{ steps.keys.outcome }}
      keys_status: ${{ steps.keys.outputs.status }}
      balances: ${{ steps.balances.outcome }}
      forward: ${{ steps.forward.outcome }}
      forward_status: ${{ steps.forward.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - run: bun install --frozen-lockfile --filter @lumenwipe/api

      - name: Variables, monitoring plan and stellar.toml agree
        id: config
        working-directory: apps/api
        run: bun run scripts/monitors/service-accounts.ts config

      - name: Service keys have not signed anything
        id: keys
        if: ${{ !cancelled() && steps.config.outcome == 'success' }}
        working-directory: apps/api
        run: bun run scripts/monitors/service-accounts.ts keys

      - name: Service accounts are above their balance floor
        id: balances
        if: ${{ !cancelled() && steps.config.outcome == 'success' }}
        working-directory: apps/api
        run: bun run scripts/monitors/service-accounts.ts balances

      - name: No service account paid out beyond the forward and the drain
        id: forward
        if: ${{ !cancelled() && steps.config.outcome == 'success' }}
        working-directory: apps/api
        run: bun run scripts/monitors/service-accounts.ts forward

  report:
    name: open an issue and alert on failure
    needs: [cadence, registry, service-accounts]
    # Not when the cadence was refused: the checks never ran, and that must not read as a finding.
    if: ${{ always() && needs.cadence.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or close the tracking issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REGISTRY: ${{ needs.registry.result }}
          REGISTRY_STATUS: ${{ needs.registry.outputs.status }}
          CONFIG: ${{ needs.service-accounts.outputs.config }}
          KEYS: ${{ needs.service-accounts.outputs.keys }}
          KEYS_STATUS: ${{ needs.service-accounts.outputs.keys_status }}
          BALANCES: ${{ needs.service-accounts.outputs.balances }}
          FORWARD: ${{ needs.service-accounts.outputs.forward }}
          FORWARD_STATUS: ${{ needs.service-accounts.outputs.forward_status }}
          # False on the 06:00 schedule, a daily or manual dispatch: the ones that comment on an
          # open issue. Decided once, in the cadence job.
          HOURLY: ${{ needs.cadence.outputs.hourly }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="An on-chain monitor is reporting a finding"

          # Exact title match, not `--search ... in:title`: that qualifier tokenizes and lags, so
          # it can comment on or close an unrelated issue. See e2e-nightly.yml.
          EXISTING=$(gh issue list --repo "$REPO" --state open --limit 200 --json number,title 2>/dev/null \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty' || true)

          # A service-account check that did not report `success` (failed, skipped behind a config
          # failure, cancelled, or no output because the job never got that far) is a finding:
          # a check that did not run must never read as clean.
          CONFIG="${CONFIG:-missing}"
          KEYS="${KEYS:-missing}"
          BALANCES="${BALANCES:-missing}"
          FORWARD="${FORWARD:-missing}"

          # What a failed registry, keys or forward step reported: a finding, or a read it could
          # not finish (RPC or Horizon error or timeout, page cap, time budget). A step that wrote
          # neither crashed, timed out or never ran, which is an incomplete read too.
          REGISTRY_STATUS="${REGISTRY_STATUS:-incomplete}"
          KEYS_STATUS="${KEYS_STATUS:-incomplete}"
          FORWARD_STATUS="${FORWARD_STATUS:-incomplete}"
          detail() { if [ "$1" = "success" ]; then echo "$1"; else echo "$1 ($2)"; fi; }

          STATUS=$(printf '%s\n' \
            "- registry hashes still match mainnet: $(detail "$REGISTRY" "$REGISTRY_STATUS")" \
            "- variables, monitoring plan and stellar.toml agree: $CONFIG" \
            "- service keys have not signed anything: $(detail "$KEYS" "$KEYS_STATUS")" \
            "- service accounts are above their balance floor: $BALANCES" \
            "- no service account paid out beyond the forward and the drain: $(detail "$FORWARD" "$FORWARD_STATUS")")

          # The registry's `cancelled` and `skipped` are a superseded run or a human stopping a
          # job: not findings, and not the clean comparison that closes the issue either.
          FINDING=no
          if [ "$REGISTRY" = "failure" ]; then FINDING=yes; fi
          for result in "$CONFIG" "$KEYS" "$BALANCES" "$FORWARD"; do
            if [ "$result" != "success" ]; then FINDING=yes; fi
          done

          if [ "$FINDING" = "no" ]; then
            if [ "$REGISTRY" = "success" ] && [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$REPO" --body "All monitors are clean again: $RUN_URL"
              gh issue close "$EXISTING" --repo "$REPO" --reason completed
              echo "alert=recovered" >> "$GITHUB_OUTPUT"
              echo "issue=$EXISTING" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          BODY=$(printf '%s\n' \
            "An on-chain monitor failed. Run: $RUN_URL" \
            "" \
            "$STATUS" \
            "" \
            "What each failure means, and what to do:" \
            "https://docs.lumenwipe.com/monitoring-plan#5-what-happens-when-an-alert-fires" \
            "(docs/monitoring-plan.md, section 5)." \
            "" \
            "A registry failure means a protocol redeployed. Exits against that contract already" \
            "halt at the registry gate, so this is not an emergency: re-verify the contract" \
            "against the protocol's own release, update the entry, and re-run the integration" \
            "suite before exits resume." \
            "" \
            "A registry incomplete read means the RPC did not answer the comparison, twice a minute" \
            "apart: rate-limited, timed out or unreachable. It is not a redeploy and nothing was" \
            "compared: re-run the workflow, or wait for the next run." \
            "" \
            "A balance failure means a service account dropped below its floor: check what" \
            "drained it before topping it up, and compare with the mediator's own transactions." \
            "" \
            "A configuration failure means the repository variables, the monitoring plan and" \
            "stellar.toml disagree, or one the plan expects is unset: the checks did not run." \
            "Fix the variable or the plan; the run log names which." \
            "" \
            "A service-key or forward finding is different. It means a key the API holds signed a" \
            "transaction this codebase did not build, or a service or retired account paid out" \
            "of its own balance. Treat it as a suspected key compromise: rotate the key and audit every" \
            "transaction it signed or paid for." \
            "" \
            "A service-key or forward incomplete read means the check could not read the whole" \
            "window: Horizon failed or timed out, the history outgrew the page cap (anyone can" \
            "fill it with tiny payments), or the job timed out. It is not evidence of a" \
            "compromise and pages nobody, but nothing it did not read is known to be clean:" \
            "re-run the workflow, and if the cap was hit, read the account's history by hand." \
            "" \
            "This issue closes itself on the next run in which every check, the registry comparison" \
            "included, is clean: the next run, or a manual one from the Actions tab.")

          # A key compromise is re-announced every hour it persists; a registry or balance
          # finding, or an incomplete read, gets one alert, then one daily comment, so the channel
          # stays readable. Only a check that found something is critical: an incomplete read is
          # one anyone can cause.
          CRITICAL=no
          if [ "$KEYS_STATUS" = "finding" ] || [ "$FORWARD_STATUS" = "finding" ]; then CRITICAL=yes; fi

          if [ -n "$EXISTING" ]; then
            if [ "$HOURLY" != "true" ]; then
              gh issue comment "$EXISTING" --repo "$REPO" --body "Still reporting: $RUN_URL"
            fi
            if [ "$CRITICAL" = "yes" ]; then echo "alert=finding" >> "$GITHUB_OUTPUT"; fi
            echo "issue=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            NEW=$(gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" \
              --label security --assignee miguelnietoa)
            echo "alert=finding" >> "$GITHUB_OUTPUT"
            echo "issue=${NEW##*/}" >> "$GITHUB_OUTPUT"
          fi
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          {
            echo "status<<EOF"
            echo "$STATUS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Alert the maintainers' channel
        if: steps.issue.outputs.alert != ''
        env:
          WEBHOOK: ${{ secrets.DISCORD_MONITORS_WEBHOOK_URL }}
          ALERT: ${{ steps.issue.outputs.alert }}
          CRITICAL: ${{ steps.issue.outputs.critical }}
          STATUS: ${{ steps.issue.outputs.status }}
          ISSUE_URL: ${{ github.server_url }}/${{ github.repository }}/issues/${{ steps.issue.outputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # A finding with nowhere to go is itself a finding: the issue above still exists, but
          # the run must show that nobody was paged.
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DISCORD_MONITORS_WEBHOOK_URL is not set; the alert was not delivered."
            exit 1
          fi

          # Only a suspected key compromise pages everyone; a registry or balance finding, an
          # incomplete read, and a recovery must not teach anyone to mute the channel.
          MENTION=""
          PARSE='[]'
          if [ "$ALERT" = "recovered" ]; then
            CONTENT=$(printf '%s\n' "✅ All on-chain monitors are clean again." "Run: $RUN_URL")
          else
            if [ "$CRITICAL" = "yes" ]; then
              MENTION="@everyone "
              PARSE='["everyone"]'
            fi
            CONTENT=$(printf '%s\n' "${MENTION}🚨 An on-chain monitor is reporting a finding." "$STATUS" \
              "What to do: https://docs.lumenwipe.com/monitoring-plan#5-what-happens-when-an-alert-fires (docs/monitoring-plan.md, section 5)" \
              "Issue: $ISSUE_URL" "Run: $RUN_URL")
          fi

          code=$(jq -n --arg c "$CONTENT" --argjson p "$PARSE" '{content: $c, allowed_mentions: {parse: $p}}' \
            | curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d @- "$WEBHOOK")
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::error::Discord returned $code; the alert was not delivered."
            exit 1
          fi
