name: on-chain monitors

# The ledger watchers described in docs/monitoring-plan.md. They answer a question no test suite
# can: has something changed on chain since the last time anyone looked? Both checks are read-only
# against public endpoints - no account, no transaction, no funds, no secret.
#
# They run on a schedule rather than on push for the reason the plan gives: a check that only fires
# when a developer happens to open a pull request is not monitoring. A contract can be upgraded, or
# a key used, during a week when nobody touches the repository.

on:
  schedule:
    # 06:00 UTC daily, an hour before the nightly e2e so the two do not report at once.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: onchain-monitors
  cancel-in-progress: false

jobs:
  # S7.Tampering.1.M.1 - the registry's recorded wasmHash against the code the contract is
  # actually running. A mismatch means a protocol redeployed and exits against it would halt at
  # the registry gate, which is the safe outcome, but nobody would know why until a user hit it.
  registry:
    name: registry hashes still match mainnet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - name: Compare every verifiedLive mainnet entry against the ledger
        working-directory: apps/api
        env:
          LUMENWIPE_RUN_INTEGRATION: "1"
        run: bun test tests/integration/mainnet-registry.integration.test.ts

  # S4b.Information.1.M.1 - the fee sponsor as a transaction's source account. LumenWipe never
  # sources a transaction from it: the sponsor pays fees, so it appears as `fee_account` and the
  # user's own account is always the source. Any transaction it originates means the key signed
  # something this codebase did not build, which is a suspected key compromise.
  #
  # Baseline measured 2026-09-18 on the testnet sponsor: 8 transactions touching the account,
  # 0 of them sourced from it. The threshold is exact rather than a guess.
  service-keys:
    name: service keys have not signed anything
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Look for transactions sourced from a service account
        env:
          # Testnet only today: the mainnet mediator and sponsor accounts are not deployed yet.
          # Adding them is one line each here once they exist.
          SPONSOR_TESTNET: GCMCGC6EJZKJJUTFY6RK43PGOODW6EL6FSHSLXBV4EYSZ3GHNJO3FXAP
          MEDIATOR_TESTNET: GC2VH6XP7HTOZHIX4OC3PU5HUXWY5XANGML4F6GBCNH5MBDFN5MU4WG7
          HORIZON: https://horizon-testnet.stellar.org
        run: |
          set -euo pipefail
          fail=0

          for pair in "fee sponsor:$SPONSOR_TESTNET" "mediator:$MEDIATOR_TESTNET"; do
            label="${pair%%:*}"
            account="${pair#*:}"

            # A 404 means the account is gone, which for a funded service account is itself worth
            # knowing. Any other non-200 is an endpoint problem, not a finding, so it fails the
            # job loudly rather than being read as "nothing to report".
            code=$(curl -sS -o /tmp/txs.json -w '%{http_code}' \
              "$HORIZON/accounts/$account/transactions?limit=200&order=desc")

            if [ "$code" = "404" ]; then
              echo "::error::The $label account $account does not exist on the ledger."
              fail=1
              continue
            fi
            if [ "$code" != "200" ]; then
              echo "::error::Horizon returned $code for the $label account. The check did not run."
              fail=1
              continue
            fi

            sourced=$(jq -r --arg a "$account" \
              '[._embedded.records[] | select(.source_account == $a)] | length' /tmp/txs.json)

            if [ "$sourced" != "0" ]; then
              echo "::error::The $label key sourced $sourced transaction(s). Expected 0."
              jq -r --arg a "$account" \
                '._embedded.records[] | select(.source_account == $a) | "  \(.created_at)  \(.hash)"' \
                /tmp/txs.json
              fail=1
            else
              echo "$label ($account): 0 transactions sourced from it, as expected."
            fi
          done

          exit "$fail"

  # Same reporting path as the nightly e2e: a red run nobody opens is the state these watchers
  # exist to fix. A failure becomes an assigned issue; the next clean run closes it.
  report:
    name: open an issue on failure
    needs: [registry, service-keys]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REGISTRY: ${{ needs.registry.result }}
          KEYS: ${{ needs.service-keys.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="An on-chain monitor is reporting a finding"

          # Exact title match, for the reasons the nightly e2e workflow documents: the search
          # qualifier tokenizes and lags, so it can comment on or close an unrelated issue.
          EXISTING=$(gh issue list --repo "$REPO" --state open --limit 200 --json number,title 2>/dev/null \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty' || true)

          # Only a real failure reports. `cancelled` and `skipped` are a superseded run or a human
          # stopping a job, and reporting those as findings is the noise that trains people to
          # ignore the tracker.
          if [ "$REGISTRY" != "failure" ] && [ "$KEYS" != "failure" ]; then
            if [ "$REGISTRY" = "success" ] && [ "$KEYS" = "success" ] && [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$REPO" --body "Both monitors are clean again: $RUN_URL"
              gh issue close "$EXISTING" --repo "$REPO" --reason completed
            fi
            exit 0
          fi

          BODY=$(printf '%s\n' \
            "An on-chain monitor failed. Run: $RUN_URL" \
            "" \
            "- registry hashes still match mainnet: $REGISTRY" \
            "- service keys have not signed anything: $KEYS" \
            "" \
            "What each failure means, and what to do, is in docs/monitoring-plan.md section 5." \
            "" \
            "A registry failure means a protocol redeployed. Exits against that contract already" \
            "halt at the registry gate, so this is not an emergency: re-verify the contract" \
            "against the protocol's own release, update the entry, and re-run the integration" \
            "suite before exits resume." \
            "" \
            "A service-key failure is different. It means a key the API holds signed a" \
            "transaction this codebase did not build. Treat it as a suspected key compromise:" \
            "rotate the key and audit every transaction it signed or paid for." \
            "" \
            "This issue closes itself on the next clean run, including a manual one from the" \
            "Actions tab.")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "Still reporting: $RUN_URL"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" \
              --label security --assignee miguelnietoa
          fi
