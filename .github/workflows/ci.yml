name: LumenWipe CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  # One job per workspace so a failure points at the exact package. Each package
  # runs only the checks it defines (packages/types is type-only, so type-check only).
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "types", pkg: "@lumenwipe/types", checks: "type-check" }
          # build:types + check-api (not the plain `build` script, which runs api-extractor in
          # --local/auto-fix mode) is what actually enforces the API report: a PR that changes
          # the SDK's public surface without updating etc/sdk.api.md fails here instead of the
          # check silently rewriting the file first. See RELEASING.md.
          - {
              name: "sdk",
              pkg: "@lumenwipe/sdk",
              checks: "type-check lint test build:types check-api",
            }
          # test:coverage runs the same suite as `test` with a coverage report printed to the
          # log - same pass/fail outcome, no threshold gate, just visibility into what's covered.
          # `build` is in the list because type-check alone cannot catch a broken build: tsc
          # with noEmit never computes an output layout at all. It does not close the gap on
          # its own, though - a change that relocates the emitted entrypoint (#81) still exits
          # 0 here, because tsc emits happily to the wrong path. Only booting the image catches
          # that, which is what the `docker` job below is for.
          - { name: "web", pkg: "@lumenwipe/web", checks: "type-check lint test:coverage build" }
          - {
              name: "api",
              pkg: "@lumenwipe/api",
              checks: "type-check lint test:coverage test:adversarial build",
            }
          - {
              name: "playground",
              pkg: "@lumenwipe/playground",
              checks: "type-check lint test build",
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: |
          for c in ${{ matrix.checks }}; do
            echo "::group::${{ matrix.pkg }} - $c"
            bun run --filter '${{ matrix.pkg }}' "$c"
            echo "::endgroup::"
          done

  # The per-protocol exit adapters (Blend, Aquarius, Soroswap), the registry canaries and the
  # token scan, run against live testnet and mainnet RPC. Read-only: nothing is signed or
  # submitted, and no secret is needed - the tests that fund accounts through friendbot and the
  # one that needs a Soroswap key skip themselves (LUMENWIPE_INTEGRATION_FUNDED,
  # SOROSWAP_API_KEY). About 20s.
  #
  # Worth gating PRs on, because these assert things only the live chain can answer: that the
  # registry's recorded wasmHash still matches the deployed code, that the SDKs still load the
  # pools, that the event-scan window is one the public RPC will actually serve. Nothing else in
  # CI can catch a testnet redeploy or a change to what an RPC accepts. The first run of this job
  # found three assertions that had been failing unnoticed - two stale since they were written,
  # one broken by #260 the day before.
  integration:
    name: integration (live RPC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One retry: a public RPC can blip, and a network hiccup must not fail a PR that has
      # nothing to do with it. A real break still fails both times.
      - name: Run integration tests
        run: |
          bun run --filter '@lumenwipe/api' test:integration ||
            bun run --filter '@lumenwipe/api' test:integration

  # The tests above stay read-only on purpose (see their own comment). This job is the funded
  # tier: LUMENWIPE_INTEGRATION_FUNDED turns on every test that funds a real testnet account
  # through friendbot, opens a real position of its own (never a pre-seeded one), and drives it
  # through the real, unmodified adapter and submit path - a Phoenix LP (plus a partial stake) on
  # the project's own reference pool, an FxDAO vault on the project's own reference deployment,
  # a sponsored trustline, and a 2-of-3 multisig close. Writing this job is what issue #286 asked
  # for; it also finally runs sponsorship.integration.test.ts and multisig-close.integration.test.ts,
  # which have been gated behind this same flag since they were written but had no job that ever
  # set it. Slower than the read-only tier (real friendbot funding and confirmation waits across
  # several tests), so it stays its own job rather than folding into the fast one above.
  #
  # GitHub withholds secrets from fork PRs, so there the two tests that need an admin key skip on
  # LUMENWIPE_FORK_PR and the rest of the tier still runs. The flag comes from the event rather than
  # from a missing secret: a secret deleted or lost on any other run still fails the job, and both
  # tests run on main once the fork's change lands.
  integration-funded:
    name: integration (funded)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run funded integration tests
        env:
          LUMENWIPE_INTEGRATION_FUNDED: "1"
          LUMENWIPE_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PHOENIX_TESTNET_TOKEN_ADMIN_SECRET: ${{ secrets.PHOENIX_TESTNET_TOKEN_ADMIN_SECRET }}
          FXDAO_TESTNET_ORACLE_ADMIN_SECRET: ${{ secrets.FXDAO_TESTNET_ORACLE_ADMIN_SECRET }}
          # Not a secret - the public Horizon-compatible endpoint sponsorship.integration.test.ts
          # and multisig-close.integration.test.ts read account state through. Never previously
          # needed in CI because neither test ran anywhere before this job existed.
          PATH_ROUTING_API_TESTNET: https://horizon-testnet.stellar.org
        run: |
          bun run --filter '@lumenwipe/api' test:integration ||
            bun run --filter '@lumenwipe/api' test:integration

  # Formatting is its own required status check (kept separate from the `check` matrix so a
  # style-only failure doesn't get lost inside a package's own type-check/lint/test group).
  prettier:
    name: prettier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

  # Everything above runs from source, so nothing exercises the production image, and two
  # different failures have already shipped through that gap. One breaks the build: a workspace
  # present in bun.lock but never copied into the build context (#135's apps/playground). The
  # other does not: a file that shifts tsc's rootDir relocates the compiled entrypoint (#81),
  # and since stage 3 copies whatever tree the builder emitted, `docker build` exports a green
  # image whose CMD then cannot find dist/main.js. So this job builds AND boots - the build
  # catches the first, /health catches the second. Same flags as deploy-api.yml so this stays
  # the same command; nothing is pushed, deploy-api.yml still builds and pushes the real image.
  docker:
    name: api image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build the API image
        run: docker build --platform linux/amd64 --provenance=false -f apps/api/Dockerfile -t lumenwipe-api:ci .

      # API_KEYS is the only variable the startup check treats as fatal (src/config/validate-env.ts)
      # and boot makes no network calls, so a throwaway value is enough to reach /health. No route
      # is exercised with it. Container logs are printed on failure - the interesting output is
      # the crash, and it is not visible anywhere else.
      - name: Boot the image and check /health
        run: |
          docker run -d --name api-smoke -e API_KEYS=ci=ci-smoke -e PORT=8080 -p 8080:8080 lumenwipe-api:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "the image never answered /health:"
          docker logs api-smoke
          exit 1

  # RELEASING.md's guardrail against the SDK silently drifting behind what's on npm: a PR that
  # touches packages/sdk/src/ (any change there reaches consumers as new behavior, whether or not
  # it changes a type) or actually changes the SDK's public surface (packages/sdk/etc/sdk.api.md -
  # the sdk matrix's check-api step already forces this file to be accurate for any real
  # packages/types/src/ surface change) must also move packages/sdk/package.json's version. A
  # packages/types/src/ change that doesn't touch sdk.api.md (a comment, an internal-only type)
  # is deliberately not enough on its own - the report, not the raw path, is the precise signal.
  # This does not publish anything - bumping the version just satisfies the check; the actual npm
  # publish still needs the sdk-vX.Y.Z tag push (publish-sdk.yml). Only meaningful on a PR (a diff
  # against its base); skipped on push, which is why the aggregate gate below treats "skipped" as
  # passing here.
  sdk-version-bump:
    name: sdk version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a version bump when the SDK's source or public surface changed
        run: |
          BASE="origin/${{ github.base_ref }}"
          NEEDS_BUMP=no
          REASON=""

          if git diff --name-only "$BASE"...HEAD | grep -qE '^packages/sdk/src/'; then
            NEEDS_BUMP=yes
            REASON="packages/sdk/src/"
          fi

          # Compared by content, not by path: sdk.api.md not existing on the base branch (this
          # PR establishing the baseline for the first time) is not itself a surface change, and
          # a path-only check can't tell that apart from a real addition/removal/retype.
          if git cat-file -e "$BASE:packages/sdk/etc/sdk.api.md" 2>/dev/null; then
            if ! git diff --quiet "$BASE"...HEAD -- packages/sdk/etc/sdk.api.md; then
              NEEDS_BUMP=yes
              REASON="${REASON:+$REASON, }packages/sdk/etc/sdk.api.md"
            fi
          fi

          if [ "$NEEDS_BUMP" = yes ]; then
            git show "$BASE:packages/sdk/package.json" > /tmp/old-sdk-package.json
            OLD_VERSION=$(node -p "require('/tmp/old-sdk-package.json').version")
            NEW_VERSION=$(node -p "require('./packages/sdk/package.json').version")
            if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
              echo "::error::$REASON changed, but packages/sdk/package.json's version is still $NEW_VERSION. Bump it - see RELEASING.md's SDK checklist. This check only catches a forgotten bump, not whether it's the right size."
              exit 1
            fi
            echo "Version bumped: $OLD_VERSION -> $NEW_VERSION"
          else
            echo "No packages/sdk/src change and no packages/sdk/etc/sdk.api.md content change in this PR - nothing to check."
          fi

  # Findings go to the Security tab and do not fail the job. The repo's CodeQL default setup
  # must stay off, or GitHub rejects this upload as a conflicting configuration.
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - .agents
              - .claude
              - .codex
              - "**/node_modules"

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  # The rule packs are fetched unpinned, so a newly published rule can fail a PR that did not
  # cause it.
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version, rule pack names, flags and targets come from scripts/security-tools.json, which
      # `bun run security:scan` reads too. The packs themselves are fetched live, so two runs on
      # different days can still differ.
      - name: Install Semgrep
        run: pipx install "semgrep==$(jq -er .semgrep.version scripts/security-tools.json)"

      - name: Scan
        run: |
          pins=scripts/security-tools.json
          configs_out="$(jq -er '.semgrep.configs[] | "--config", .' "$pins")"
          flags_out="$(jq -er '.semgrep.flags[]' "$pins")"
          targets_out="$(jq -er '.semgrep.targets[]' "$pins")"
          mapfile -t configs <<< "$configs_out"
          mapfile -t flags <<< "$flags_out"
          mapfile -t targets <<< "$targets_out"
          semgrep scan "${configs[@]}" "${flags[@]}" --error --sarif-output=semgrep.sarif "${targets[@]}"

      - name: Upload results
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Full history, since a deleted key is still exposed. Not gitleaks-action: it needs a paid
  # licence on an organization's repo.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Version, checksum, config and log range come from scripts/security-tools.json, shared
      # with `bun run security:scan`.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="$(jq -er .gitleaks.version scripts/security-tools.json)"
          GITLEAKS_SHA256="$(jq -er .gitleaks.linuxSha256 scripts/security-tools.json)"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan the full history
        run: |
          pins=scripts/security-tools.json
          flags_out="$(jq -er '.gitleaks.flags[]' "$pins")"
          log_opts="$(jq -er .gitleaks.logOpts "$pins")"
          config="$(jq -er .gitleaks.config "$pins")"
          ignore="$(jq -er .gitleaks.ignore "$pins")"
          mapfile -t flags <<< "$flags_out"
          ./gitleaks git --log-opts="$log_opts" --config "$config" --gitleaks-ignore-path "$ignore" \
            "${flags[@]}" .

  # The advisory database moves independently of this repo, so a new high or critical advisory
  # turns this red on an unchanged lockfile. Accepted exceptions live in
  # scripts/audit-allowlist.json with a reason and an expiry; an unreachable endpoint fails the job.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test the audit gate
        run: bun test scripts/audit-gate.test.ts

      - name: Test the Vercel ignore script
        run: bun test scripts/vercel-ignore.test.ts

      - name: Test the error reference check
        run: bun test scripts/check-error-reference.test.ts

      - name: Test the security scan report
        run: bun test scripts/security-scan.test.ts

      - name: Audit dependencies
        run: bun run scripts/audit-gate.ts

  # A floating action tag runs whatever its owner retags it to, with this repo's credentials, and
  # a job with no timeout can hold a runner for six hours. actionlint catches workflow errors; the
  # script enforces the two rules it does not: a full-SHA pin with a version comment, and a
  # timeout on every job.
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          rm actionlint.tar.gz

      - name: Lint workflows
        run: ./actionlint -color

      - name: Require pinned actions and job timeouts
        run: scripts/check-workflows.sh

  # The docs site and the diagrams embedded in it have no other guard: a broken link, a page that
  # never reaches the sidebar, a failing Mintlify build or a diagram edited without re-rendering
  # all ship silently. Only meaningful on a PR (a diff against its base); every step is gated on
  # the changed-files check, so an unrelated PR passes this job without running anything, and
  # a push skips it. The aggregate gate treats skipped as passing. Link checks on third-party
  # sites are reported but never fail the job, since someone else's outage must not block a PR.
  docs:
    name: docs
    # Pinned because the diagram check compares against SVGs rendered by this image's apt Graphviz.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    env:
      LYCHEE_VERSION: 0.24.2
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
      MINT_VERSION: 4.2.778
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect docs changes
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD |
            grep -qE '^(docs/|diagrams/|README\.md$|CONTRIBUTING\.md$|scripts/check-(docs-nav\.mjs|diagrams\.sh|error-reference\.mjs)$|apps/api/src/common/error-codes\.ts$|\.github/workflows/ci\.yml$)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "No docs, diagram or docs-tooling change in this PR - nothing to check."
          fi

      - name: Set up Node
        if: steps.changed.outputs.docs == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Check every docs page is in the navigation
        if: steps.changed.outputs.docs == 'true'
        run: node scripts/check-docs-nav.mjs

      - name: Check the error reference lists every API error code
        if: steps.changed.outputs.docs == 'true'
        run: node scripts/check-error-reference.mjs

      - name: Check internal docs links
        if: steps.changed.outputs.docs == 'true'
        working-directory: docs
        run: npx --yes "mint@${MINT_VERSION}" broken-links

      - name: Validate the Mintlify build
        if: steps.changed.outputs.docs == 'true'
        working-directory: docs
        run: npx --yes "mint@${MINT_VERSION}" validate

      - name: Install lychee
        if: steps.changed.outputs.docs == 'true'
        run: |
          curl -sSfL -o lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum -c -
          tar -xzf lychee.tar.gz --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          rm lychee.tar.gz

      - name: Check links in the root documents
        if: steps.changed.outputs.docs == 'true'
        run: ./lychee --offline --no-progress README.md CONTRIBUTING.md

      - name: Report external links
        if: steps.changed.outputs.docs == 'true'
        continue-on-error: true
        run: |
          ./lychee --no-progress --scheme https --max-retries 3 --retry-wait-time 5 --timeout 20 \
            --accept '200..=299,403,429' README.md CONTRIBUTING.md 'docs/**/*.md' 'docs/**/*.mdx'

      - name: Set up Python
        if: steps.changed.outputs.docs == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Check the rendered diagrams match their sources
        if: steps.changed.outputs.docs == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq graphviz
          pip install --quiet graphviz==0.20.3
          scripts/check-diagrams.sh

      - name: Upload the CI-rendered diagrams
        if: ${{ failure() && steps.changed.outputs.docs == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-diagrams
          path: docs/diagrams/output

  # The invariant register, the controller list and a few other claims in the docs name files,
  # symbols and tests. Nothing else notices when a refactor makes one of them untrue, so this
  # job fails the build instead. It needs no install: the script uses only Bun and node:*.
  docs-claims:
    name: docs claims
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Test the docs claim check
        run: bun test ./scripts/check-docs-claims.test.ts

      - name: Check documented claims against the code
        run: bun run check:docs

  # Aggregate gate: keeps the existing required-status-check name so branch
  # protection needs no change. Passes only if every job above passed.
  ci:
    name: type-check · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs:
      [
        check,
        integration,
        integration-funded,
        docker,
        prettier,
        sdk-version-bump,
        codeql,
        semgrep,
        gitleaks,
        audit,
        workflow-lint,
        docs,
        docs-claims,
      ]
    if: ${{ always() }}
    steps:
      - name: Verify every check passed
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "One or more package checks failed."
            exit 1
          fi
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "Integration tests against live RPC failed."
            exit 1
          fi
          if [ "${{ needs.integration-funded.result }}" != "success" ]; then
            echo "Funded integration tests (Phoenix, FxDAO, sponsorship, multisig) failed."
            exit 1
          fi
          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "The API image failed to build."
            exit 1
          fi
          if [ "${{ needs.prettier.result }}" != "success" ]; then
            echo "Formatting check failed."
            exit 1
          fi
          if [ "${{ needs.codeql.result }}" != "success" ]; then
            echo "CodeQL analysis failed to run."
            exit 1
          fi
          if [ "${{ needs.semgrep.result }}" != "success" ]; then
            echo "Semgrep reported a finding."
            exit 1
          fi
          if [ "${{ needs.gitleaks.result }}" != "success" ]; then
            echo "gitleaks found a secret in the git history."
            exit 1
          fi
          if [ "${{ needs.audit.result }}" != "success" ]; then
            echo "Dependency audit found a blocking advisory or could not run."
            exit 1
          fi
          if [ "${{ needs.workflow-lint.result }}" != "success" ]; then
            echo "A workflow is unpinned, has no job timeout or fails actionlint."
            exit 1
          fi
          # skipped (not run on a push event) counts as passing for docs too.
          if [ "${{ needs.docs.result }}" != "success" ] && [ "${{ needs.docs.result }}" != "skipped" ]; then
            echo "Docs links, navigation, build or diagrams are broken - see the docs job."
            exit 1
          fi
          if [ "${{ needs.docs-claims.result }}" != "success" ]; then
            echo "A documented claim no longer matches the code - see the docs claims job."
            exit 1
          fi
          # skipped (not run on a push event) counts as passing - only a real failure blocks.
          if [ "${{ needs.sdk-version-bump.result }}" != "success" ] && [ "${{ needs.sdk-version-bump.result }}" != "skipped" ]; then
            echo "SDK changed without a version bump - see RELEASING.md."
            exit 1
          fi
          echo "All package checks passed."
