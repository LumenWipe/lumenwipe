name: LumenWipe CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # One job per workspace so a failure points at the exact package. Each package
  # runs only the checks it defines (packages/types is type-only, so type-check only).
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "types", pkg: "@lumenwipe/types", checks: "type-check" }
          - { name: "sdk", pkg: "@lumenwipe/sdk", checks: "type-check lint test" }
          # test:coverage runs the same suite as `test` with a coverage report printed to the
          # log - same pass/fail outcome, no threshold gate, just visibility into what's covered.
          # `build` is in the list because type-check alone cannot catch a broken build: tsc
          # with noEmit never computes an output layout at all. It does not close the gap on
          # its own, though - a change that relocates the emitted entrypoint (#81) still exits
          # 0 here, because tsc emits happily to the wrong path. Only booting the image catches
          # that, which is what the `docker` job below is for.
          - { name: "web", pkg: "@lumenwipe/web", checks: "type-check lint test:coverage build" }
          - {
              name: "api",
              pkg: "@lumenwipe/api",
              checks: "type-check lint test:coverage test:adversarial build",
            }
          - {
              name: "playground",
              pkg: "@lumenwipe/playground",
              checks: "type-check lint test build",
            }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: |
          for c in ${{ matrix.checks }}; do
            echo "::group::${{ matrix.pkg }} - $c"
            bun run --filter '${{ matrix.pkg }}' "$c"
            echo "::endgroup::"
          done

  # Repo-wide, not per-package - Prettier has no workspace boundary, and formatting drift was
  # previously invisible until someone ran `bun run format` locally (#149's PR discussion). Uses
  # the same `.prettierignore` as the local `format`/`format:check` scripts, so a passing local
  # check always matches this job.
  format:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

  # Everything above runs from source, so nothing exercises the production image, and two
  # different failures have already shipped through that gap. One breaks the build: a workspace
  # present in bun.lock but never copied into the build context (#135's apps/playground). The
  # other does not: a file that shifts tsc's rootDir relocates the compiled entrypoint (#81),
  # and since stage 3 copies whatever tree the builder emitted, `docker build` exports a green
  # image whose CMD then cannot find dist/main.js. So this job builds AND boots - the build
  # catches the first, /health catches the second. Same flags as deploy-api.yml so this stays
  # the same command; nothing is pushed, deploy-api.yml still builds and pushes the real image.
  docker:
    name: api image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build --platform linux/amd64 --provenance=false -f apps/api/Dockerfile -t lumenwipe-api:ci .

      # API_KEYS is the only variable the startup check treats as fatal (src/config/validate-env.ts)
      # and boot makes no network calls, so a throwaway value is enough to reach /health. No route
      # is exercised with it. Container logs are printed on failure - the interesting output is
      # the crash, and it is not visible anywhere else.
      - name: Boot the image and check /health
        run: |
          docker run -d --name api-smoke -e API_KEYS=ci=ci-smoke -e PORT=8080 -p 8080:8080 lumenwipe-api:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "the image never answered /health:"
          docker logs api-smoke
          exit 1

  # Aggregate gate: keeps the existing required-status-check name so branch
  # protection needs no change. Passes only if every job above passed.
  ci:
    name: type-check · lint · test
    runs-on: ubuntu-latest
    needs: [check, docker, format]
    if: ${{ always() }}
    steps:
      - name: Verify every check passed
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "One or more package checks failed."
            exit 1
          fi
          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "The API image failed to build."
            exit 1
          fi
          if [ "${{ needs.format.result }}" != "success" ]; then
            echo "Prettier formatting check failed."
            exit 1
          fi
          echo "All package checks passed."
