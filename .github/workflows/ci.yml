name: LumenWipe CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # One job per workspace so a failure points at the exact package. Each package
  # runs only the checks it defines (packages/types is type-only, so type-check only).
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "types", pkg: "@lumenwipe/types", checks: "type-check" }
          # build:types + check-api (not the plain `build` script, which runs api-extractor in
          # --local/auto-fix mode) is what actually enforces the API report: a PR that changes
          # the SDK's public surface without updating etc/sdk.api.md fails here instead of the
          # check silently rewriting the file first. See RELEASING.md.
          - {
              name: "sdk",
              pkg: "@lumenwipe/sdk",
              checks: "type-check lint test build:types check-api",
            }
          # test:coverage runs the same suite as `test` with a coverage report printed to the
          # log - same pass/fail outcome, no threshold gate, just visibility into what's covered.
          # `build` is in the list because type-check alone cannot catch a broken build: tsc
          # with noEmit never computes an output layout at all. It does not close the gap on
          # its own, though - a change that relocates the emitted entrypoint (#81) still exits
          # 0 here, because tsc emits happily to the wrong path. Only booting the image catches
          # that, which is what the `docker` job below is for.
          - { name: "web", pkg: "@lumenwipe/web", checks: "type-check lint test:coverage build" }
          - {
              name: "api",
              pkg: "@lumenwipe/api",
              checks: "type-check lint test:coverage test:adversarial build",
            }
          - {
              name: "playground",
              pkg: "@lumenwipe/playground",
              checks: "type-check lint test build",
            }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: |
          for c in ${{ matrix.checks }}; do
            echo "::group::${{ matrix.pkg }} - $c"
            bun run --filter '${{ matrix.pkg }}' "$c"
            echo "::endgroup::"
          done

  # The per-protocol exit adapters (Blend, Aquarius, Soroswap), the registry canaries and the
  # token scan, run against live testnet and mainnet RPC. Read-only: nothing is signed or
  # submitted, and no secret is needed - the tests that fund accounts through friendbot and the
  # one that needs a Soroswap key skip themselves (LUMENWIPE_INTEGRATION_FUNDED,
  # SOROSWAP_API_KEY). About 20s.
  #
  # Worth gating PRs on, because these assert things only the live chain can answer: that the
  # registry's recorded wasmHash still matches the deployed code, that the SDKs still load the
  # pools, that the event-scan window is one the public RPC will actually serve. Nothing else in
  # CI can catch a testnet redeploy or a change to what an RPC accepts. The first run of this job
  # found three assertions that had been failing unnoticed - two stale since they were written,
  # one broken by #260 the day before.
  integration:
    name: integration (live RPC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One retry: a public RPC can blip, and a network hiccup must not fail a PR that has
      # nothing to do with it. A real break still fails both times.
      - name: Run integration tests
        run: |
          bun run --filter '@lumenwipe/api' test:integration ||
            bun run --filter '@lumenwipe/api' test:integration

  # The tests above stay read-only on purpose (see their own comment). This job is the funded
  # tier: LUMENWIPE_INTEGRATION_FUNDED turns on every test that funds a real testnet account
  # through friendbot, opens a real position of its own (never a pre-seeded one), and drives it
  # through the real, unmodified adapter and submit path - a Phoenix LP (plus a partial stake) on
  # the project's own reference pool, an FxDAO vault on the project's own reference deployment,
  # a sponsored trustline, and a 2-of-3 multisig close. Writing this job is what issue #286 asked
  # for; it also finally runs sponsorship.integration.test.ts and multisig-close.integration.test.ts,
  # which have been gated behind this same flag since they were written but had no job that ever
  # set it. Slower than the read-only tier (real friendbot funding and confirmation waits across
  # several tests), so it stays its own job rather than folding into the fast one above.
  integration-funded:
    name: integration (funded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run funded integration tests
        env:
          LUMENWIPE_INTEGRATION_FUNDED: "1"
          PHOENIX_TESTNET_TOKEN_ADMIN_SECRET: ${{ secrets.PHOENIX_TESTNET_TOKEN_ADMIN_SECRET }}
          FXDAO_TESTNET_ORACLE_ADMIN_SECRET: ${{ secrets.FXDAO_TESTNET_ORACLE_ADMIN_SECRET }}
          # Not a secret - the public Horizon-compatible endpoint sponsorship.integration.test.ts
          # and multisig-close.integration.test.ts read account state through. Never previously
          # needed in CI because neither test ran anywhere before this job existed.
          PATH_ROUTING_API_TESTNET: https://horizon-testnet.stellar.org
        run: |
          bun run --filter '@lumenwipe/api' test:integration ||
            bun run --filter '@lumenwipe/api' test:integration

  # Formatting is its own required status check (kept separate from the `check` matrix so a
  # style-only failure doesn't get lost inside a package's own type-check/lint/test group).
  prettier:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Scoped to the workspaces, not the whole repo: root-level docs (README, CONTRIBUTING,
      # diagrams/) and non-product assets aren't held to this convention.
      - name: Check formatting
        run: bunx prettier --check "apps/**/*" "packages/**/*" --ignore-unknown

  # Everything above runs from source, so nothing exercises the production image, and two
  # different failures have already shipped through that gap. One breaks the build: a workspace
  # present in bun.lock but never copied into the build context (#135's apps/playground). The
  # other does not: a file that shifts tsc's rootDir relocates the compiled entrypoint (#81),
  # and since stage 3 copies whatever tree the builder emitted, `docker build` exports a green
  # image whose CMD then cannot find dist/main.js. So this job builds AND boots - the build
  # catches the first, /health catches the second. Same flags as deploy-api.yml so this stays
  # the same command; nothing is pushed, deploy-api.yml still builds and pushes the real image.
  docker:
    name: api image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the API image
        run: docker build --platform linux/amd64 --provenance=false -f apps/api/Dockerfile -t lumenwipe-api:ci .

      # API_KEYS is the only variable the startup check treats as fatal (src/config/validate-env.ts)
      # and boot makes no network calls, so a throwaway value is enough to reach /health. No route
      # is exercised with it. Container logs are printed on failure - the interesting output is
      # the crash, and it is not visible anywhere else.
      - name: Boot the image and check /health
        run: |
          docker run -d --name api-smoke -e API_KEYS=ci=ci-smoke -e PORT=8080 -p 8080:8080 lumenwipe-api:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "the image never answered /health:"
          docker logs api-smoke
          exit 1

  # RELEASING.md's guardrail against the SDK silently drifting behind what's on npm: a PR that
  # touches packages/sdk/src/ (any change there reaches consumers as new behavior, whether or not
  # it changes a type) or actually changes the SDK's public surface (packages/sdk/etc/sdk.api.md -
  # the sdk matrix's check-api step already forces this file to be accurate for any real
  # packages/types/src/ surface change) must also move packages/sdk/package.json's version. A
  # packages/types/src/ change that doesn't touch sdk.api.md (a comment, an internal-only type)
  # is deliberately not enough on its own - the report, not the raw path, is the precise signal.
  # This does not publish anything - bumping the version just satisfies the check; the actual npm
  # publish still needs the sdk-vX.Y.Z tag push (publish-sdk.yml). Only meaningful on a PR (a diff
  # against its base); skipped on push, which is why the aggregate gate below treats "skipped" as
  # passing here.
  sdk-version-bump:
    name: sdk version bump
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a version bump when the SDK's source or public surface changed
        run: |
          BASE="origin/${{ github.base_ref }}"
          NEEDS_BUMP=no
          REASON=""

          if git diff --name-only "$BASE"...HEAD | grep -qE '^packages/sdk/src/'; then
            NEEDS_BUMP=yes
            REASON="packages/sdk/src/"
          fi

          # Compared by content, not by path: sdk.api.md not existing on the base branch (this
          # PR establishing the baseline for the first time) is not itself a surface change, and
          # a path-only check can't tell that apart from a real addition/removal/retype.
          if git cat-file -e "$BASE:packages/sdk/etc/sdk.api.md" 2>/dev/null; then
            if ! git diff --quiet "$BASE"...HEAD -- packages/sdk/etc/sdk.api.md; then
              NEEDS_BUMP=yes
              REASON="${REASON:+$REASON, }packages/sdk/etc/sdk.api.md"
            fi
          fi

          if [ "$NEEDS_BUMP" = yes ]; then
            git show "$BASE:packages/sdk/package.json" > /tmp/old-sdk-package.json
            OLD_VERSION=$(node -p "require('/tmp/old-sdk-package.json').version")
            NEW_VERSION=$(node -p "require('./packages/sdk/package.json').version")
            if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
              echo "::error::$REASON changed, but packages/sdk/package.json's version is still $NEW_VERSION. Bump it - see RELEASING.md's SDK checklist. This check only catches a forgotten bump, not whether it's the right size."
              exit 1
            fi
            echo "Version bumped: $OLD_VERSION -> $NEW_VERSION"
          else
            echo "No packages/sdk/src change and no packages/sdk/etc/sdk.api.md content change in this PR - nothing to check."
          fi

  # Findings go to the Security tab and do not fail the job. The repo's CodeQL default setup
  # must stay off, or GitHub rejects this upload as a conflicting configuration.
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - .agents
              - .claude
              - .codex
              - "**/node_modules"

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # The rule packs are fetched unpinned, so a newly published rule can fail a PR that did not
  # cause it.
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.175.0
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Scan
        run: |
          semgrep scan \
            --config p/security-audit --config p/typescript --config p/javascript --config p/secrets \
            --metrics=off --error --sarif-output=semgrep.sarif \
            apps packages

      - name: Upload results
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Full history, since a deleted key is still exposed. Not gitleaks-action: it needs a paid
  # licence on an organization's repo.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan the full history
        run: ./gitleaks git --log-opts=HEAD --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact --no-banner .

  # Aggregate gate: keeps the existing required-status-check name so branch
  # protection needs no change. Passes only if every job above passed.
  ci:
    name: type-check · lint · test
    runs-on: ubuntu-latest
    needs:
      [
        check,
        integration,
        integration-funded,
        docker,
        prettier,
        sdk-version-bump,
        codeql,
        semgrep,
        gitleaks,
      ]
    if: ${{ always() }}
    steps:
      - name: Verify every check passed
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "One or more package checks failed."
            exit 1
          fi
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "Integration tests against live RPC failed."
            exit 1
          fi
          if [ "${{ needs.integration-funded.result }}" != "success" ]; then
            echo "Funded integration tests (Phoenix, FxDAO, sponsorship, multisig) failed."
            exit 1
          fi
          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "The API image failed to build."
            exit 1
          fi
          if [ "${{ needs.prettier.result }}" != "success" ]; then
            echo "Formatting check failed."
            exit 1
          fi
          if [ "${{ needs.codeql.result }}" != "success" ]; then
            echo "CodeQL analysis failed to run."
            exit 1
          fi
          if [ "${{ needs.semgrep.result }}" != "success" ]; then
            echo "Semgrep reported a finding."
            exit 1
          fi
          if [ "${{ needs.gitleaks.result }}" != "success" ]; then
            echo "gitleaks found a secret in the git history."
            exit 1
          fi
          # skipped (not run on a push event) counts as passing - only a real failure blocks.
          if [ "${{ needs.sdk-version-bump.result }}" != "success" ] && [ "${{ needs.sdk-version-bump.result }}" != "skipped" ]; then
            echo "SDK changed without a version bump - see RELEASING.md."
            exit 1
          fi
          echo "All package checks passed."
