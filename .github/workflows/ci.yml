name: LumenWipe CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # One job per workspace so a failure points at the exact package. Each package
  # runs only the checks it defines (packages/types is type-only, so type-check only).
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "types", pkg: "@lumenwipe/types", checks: "type-check" }
          - { name: "sdk", pkg: "@lumenwipe/sdk", checks: "type-check lint test" }
          # test:coverage runs the same suite as `test` with a coverage report printed to the
          # log - same pass/fail outcome, no threshold gate, just visibility into what's covered.
          # `build` is in the list because type-check alone cannot catch a broken build:
          # tsc with noEmit never computes an output layout, so a change that relocates the
          # emitted entrypoint (or a file the Docker build never copies) passes every check and
          # fails first on the production deploy. That happened in #81 and cost a full
          # debugging cycle to find by hand.
          - { name: "web", pkg: "@lumenwipe/web", checks: "type-check lint test:coverage build" }
          - { name: "api", pkg: "@lumenwipe/api", checks: "type-check lint test:coverage build" }
          - { name: "playground", pkg: "@lumenwipe/playground", checks: "type-check lint test build" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: |
          for c in ${{ matrix.checks }}; do
            echo "::group::${{ matrix.pkg }} - $c"
            bun run --filter '${{ matrix.pkg }}' "$c"
            echo "::endgroup::"
          done

  # The package checks above all run from source, so nothing in them exercises the
  # production image: a workspace added to bun.lock but never copied into the build
  # context passes every check and fails first on the Cloud Run deploy (that is how
  # #135's apps/playground broke it, and #81 before that). Build the image here so
  # Dockerfile drift is caught on the PR. Image is built, not pushed - deploy-api.yml
  # still builds and pushes the real one on main.
  docker:
    name: api image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build --provenance=false -f apps/api/Dockerfile -t lumenwipe-api:ci .

  # Aggregate gate: keeps the existing required-status-check name so branch
  # protection needs no change. Passes only if every job above passed.
  ci:
    name: type-check · lint · test
    runs-on: ubuntu-latest
    needs: [check, docker]
    if: ${{ always() }}
    steps:
      - name: Verify every check passed
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "One or more package checks failed."
            exit 1
          fi
          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "The API image failed to build."
            exit 1
          fi
          echo "All package checks passed."
