name: LumenWipe CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# The docs job installs lychee on a PR only; the release-binary-cache job reads the same pins on a
# push to main so a PR can restore the archive from main's cache.
env:
  LYCHEE_VERSION: 0.24.2
  LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a

jobs:
  # One job per workspace so a failure points at the exact package. Each package
  # runs only the checks it defines (packages/types is type-only, so type-check only).
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "types", pkg: "@lumenwipe/types", checks: "type-check" }
          # build:types + check-api (before build:dist, which runs api-extractor in
          # --local/auto-fix mode) is what actually enforces the API report: a PR that changes
          # the SDK's public surface without updating etc/sdk.api.md fails here instead of the
          # check silently rewriting the file first. pack:check then checks the packed tarball
          # (file list, publint, attw, ESM and CJS install, minimum TypeScript) and release:check
          # that the version, SDK_VERSION, changelog and docs pin agree. See RELEASING.md.
          - {
              name: "sdk",
              pkg: "@lumenwipe/sdk",
              checks: "type-check lint test:coverage coverage:gate build:types check-api build:dist pack:check release:check",
            }
          # The reference verifier, compiled from the web's verify(). `test` builds the bundle
          # first and runs the conformance vectors against it in both module formats; the web
          # row runs the same vectors against the source. check-api holds its public types,
          # before build:dist rolls them up in --local mode. pack:check checks the packed tarball
          # (file list, publint, attw) and release:check that the version and changelog agree.
          - {
              name: "verify",
              pkg: "@lumenwipe/verify",
              checks: "type-check lint test build:types check-api build:dist pack:check release:check",
            }
          # test:coverage runs the same suite as `test` and writes an lcov report; coverage:gate
          # then holds each trust-boundary file in scripts/coverage-thresholds.json to its minimum
          # line coverage and prints the gated files in the job summary.
          # `build` is in the list because type-check alone cannot catch a broken build: tsc
          # with noEmit never computes an output layout at all. It does not close the gap on
          # its own, though - a change that relocates the emitted entrypoint (#81) still exits
          # 0 here, because tsc emits happily to the wrong path. Only booting the image catches
          # that, which is what the `docker` job below is for.
          # check:env fails when apps/web/.env.example and the variables the app reads disagree.
          - {
              name: "web",
              pkg: "@lumenwipe/web",
              checks: "type-check lint test:coverage coverage:gate check:env build",
            }
          - {
              name: "api",
              pkg: "@lumenwipe/api",
              checks: "type-check lint test:coverage coverage:gate test:adversarial build",
            }
          - {
              name: "playground",
              pkg: "@lumenwipe/playground",
              checks: "type-check lint test:coverage build",
            }
          # The latency lab's own checks. Never its `lab` script: the lab runs only on a person's
          # machine (tools/lab/tests/no-workflow.test.ts fails a workflow that invokes it).
          - { name: "lab", pkg: "@lumenwipe/lab", checks: "type-check lint test" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # pack:check installs and runs the packed SDK with the node on PATH, so the sdk row runs
      # it on the oldest Node the package supports (engines.node).
      - name: Set up the minimum supported Node for the SDK
        if: matrix.name == 'sdk'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Every other row builds and runs on the contributor Node pinned in .tool-versions.
      - name: Set up Node from .tool-versions
        if: matrix.name != 'sdk'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The fonts are self-hosted files (apps/*/app/fonts), so the build must not need a font host:
      # with both Google Fonts hosts unresolvable, a build that fetches a font fails here.
      - name: Block the Google Fonts hosts
        if: matrix.name == 'web' || matrix.name == 'playground'
        shell: bash
        run: |
          printf "%s fonts.googleapis.com fonts.gstatic.com\n" 0.0.0.0 :: | sudo tee -a /etc/hosts

      - name: Run checks
        run: |
          for c in ${{ matrix.checks }}; do
            echo "::group::${{ matrix.pkg }} - $c"
            bun run --filter '${{ matrix.pkg }}' "$c"
            echo "::endgroup::"
          done

      # A contract registry entry last verified more than 60 days ago is a warning annotation, not
      # a failure: validUntil is the gate. A registry that cannot be read or does not validate
      # still fails the step.
      - name: Warn about contract registry entries due for re-verification
        if: matrix.name == 'api'
        shell: bash
        run: bun run --filter '@lumenwipe/api' registry:staleness

      # CONTRIBUTING.md section 3, as written, on this fresh checkout: copy the examples, set the
      # sample key, start the API and the web in development, and require /health from the API and
      # /api/health from the web, which reaches the API through its proxy with that key. No secret
      # is used, and booting and both health routes make no upstream call, so nothing reaches
      # testnet or mainnet. scripts/check-docs-claims.ts fails when the documented commands and
      # this step disagree.
      - name: Follow the development setup in CONTRIBUTING.md
        if: matrix.name == 'api'
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          cp apps/api/.env.example apps/api/.env.local
          cp apps/web/.env.example apps/web/.env.local
          printf 'LUMENWIPE_API_KEY=abc123\n' >> apps/web/.env.local
          bun run dev:api > api-dev.log 2>&1 &
          api_pid=$!
          bun dev > web-dev.log 2>&1 &
          web_pid=$!
          stop() {
            kill "$api_pid" "$web_pid" 2> /dev/null || true
            pkill -f 'nest start' 2> /dev/null || true
            pkill -f 'next dev' 2> /dev/null || true
          }
          trap stop EXIT
          wait_for() {
            for i in $(seq 1 90); do
              if body="$(curl -fsS "$1" 2> /dev/null)" && [[ "$body" == *"$2"* ]]; then
                echo "$1 answered after ${i}s: $body"
                return 0
              fi
              sleep 1
            done
            echo "::error::$1 did not answer with $2 within 90s"
            echo "--- API log"; cat api-dev.log
            echo "--- web log"; cat web-dev.log
            return 1
          }
          wait_for http://localhost:3001/health '"status":"ok"'
          wait_for http://localhost:3000/api/health '"api":"ok"'

  # The per-protocol exit adapters (Blend, Aquarius, Soroswap), the registry canaries and the
  # token scan, run against live testnet and mainnet RPC. Read-only: nothing is signed or
  # submitted, and no secret is needed - the tests that fund accounts through friendbot and the
  # one that needs a Soroswap key skip themselves (LUMENWIPE_INTEGRATION_FUNDED,
  # SOROSWAP_API_KEY). About 20s.
  #
  # Worth gating PRs on, because these assert things only the live chain can answer: that the
  # registry's recorded wasmHash still matches the deployed code, that the SDKs still load the
  # pools, that the event-scan window is one the public RPC will actually serve. Nothing else in
  # CI can catch a testnet redeploy or a change to what an RPC accepts. The first run of this job
  # found three assertions that had been failing unnoticed - two stale since they were written,
  # one broken by #260 the day before.
  integration:
    name: integration (live RPC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One retry: a public RPC can blip, and a network hiccup must not fail a PR that has
      # nothing to do with it. A real break still fails both times.
      - name: Run integration tests
        env:
          # Gateway first: SDF's endpoint stalls for seconds on a share of calls. SDF stays as the failover.
          STELLAR_RPC_TESTNET: https://soroban-rpc.testnet.stellar.gateway.fm,https://soroban-testnet.stellar.org
        run: |
          bun run --filter '@lumenwipe/api' test:integration ||
            bun run --filter '@lumenwipe/api' test:integration

  # The tests above stay read-only on purpose (see their own comment). This job is the funded
  # tier: LUMENWIPE_INTEGRATION_FUNDED turns on every test that funds a real testnet account
  # through friendbot, opens a real position of its own (never a pre-seeded one), and drives it
  # through the real, unmodified adapter and submit path - a Phoenix LP (plus a partial stake) on
  # the project's own reference pool, an FxDAO vault on the project's own reference deployment,
  # a sponsored trustline, and a 2-of-3 multisig close. Writing this job is what issue #286 asked
  # for; it also finally runs sponsorship.integration.test.ts and multisig-close.integration.test.ts,
  # which have been gated behind this same flag since they were written but had no job that ever
  # set it. Slower than the read-only tier (real friendbot funding and confirmation waits across
  # several tests), so it stays its own job rather than folding into the fast one above.
  #
  # The Phoenix and FxDAO tests need two testnet admin keys, which live only in the testnet-funded
  # environment, deployable from main alone. So the tier is split by event: a push to main runs it
  # whole with the keys, and every PR, same-repo or fork, runs it without them, so a branch that
  # edits this file cannot reach the keys. Those two tests skip on LUMENWIPE_ADMIN_KEYS_WITHHELD,
  # set from the event rather than from a missing secret, so a key lost on main still fails the job.
  # A maintainer runs them on a PR's reviewed commit with integration-funded-review.yml.
  integration-funded:
    name: integration (funded)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testnet-funded
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run funded integration tests
        env:
          LUMENWIPE_INTEGRATION_FUNDED: "1"
          # Gateway first: SDF's endpoint stalls for seconds on a share of calls. SDF stays as the failover.
          STELLAR_RPC_TESTNET: https://soroban-rpc.testnet.stellar.gateway.fm,https://soroban-testnet.stellar.org
          PHOENIX_TESTNET_TOKEN_ADMIN_SECRET: ${{ secrets.PHOENIX_TESTNET_TOKEN_ADMIN_SECRET }}
          FXDAO_TESTNET_ORACLE_ADMIN_SECRET: ${{ secrets.FXDAO_TESTNET_ORACLE_ADMIN_SECRET }}
          # Not a secret - the public Horizon-compatible endpoint sponsorship.integration.test.ts
          # and multisig-close.integration.test.ts read account state through.
          PATH_ROUTING_API_TESTNET: https://horizon-testnet.stellar.org
        run: |
          bun run --filter '@lumenwipe/api' test:integration ||
            bun run --filter '@lumenwipe/api' test:integration

  integration-funded-pr:
    name: integration (funded, no admin keys)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run funded integration tests without the admin keys
        env:
          LUMENWIPE_INTEGRATION_FUNDED: "1"
          LUMENWIPE_ADMIN_KEYS_WITHHELD: "true"
          STELLAR_RPC_TESTNET: https://soroban-rpc.testnet.stellar.gateway.fm,https://soroban-testnet.stellar.org
          PATH_ROUTING_API_TESTNET: https://horizon-testnet.stellar.org
        run: |
          bun run --filter '@lumenwipe/api' test:integration ||
            bun run --filter '@lumenwipe/api' test:integration

      - name: Report the tests skipped without the admin keys
        run: |
          {
            echo "Skipped on a PR: the Phoenix and FxDAO admin-key tests (phoenix-exit-adapter, fxdao-exit-adapter)."
            echo "They run on every push to main, and on a reviewed PR commit through integration-funded-review.yml."
          } >> "$GITHUB_STEP_SUMMARY"

  # axe (WCAG 2.2 A and AA) on every app route at phone, tablet and desktop widths, plus Tab
  # reachability on entry and analyze. Every /api call is answered by fixtures in the browser, so
  # it needs no API, no secret and no testnet, and runs against the production build. A serious
  # or critical violation fails it. See CONTRIBUTING.md, "Accessibility gate".
  #
  # On a PR that changes what the web app is built from (the list scripts/vercel-ignore.mjs watches),
  # the job then runs Lighthouse against the same build: four routes, three mobile runs each on a
  # fixed simulated throttling profile (apps/web/lighthouserc.json), with every host but localhost
  # unresolvable so no run depends on a third party. It reports only: the medians go to the job
  # summary and the reports to an artifact, every Lighthouse step is continue-on-error, and nothing
  # is asserted. About three minutes. Baseline: docs/web-performance-baseline.mdx.
  a11y:
    name: web accessibility (axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same image as the nightly e2e jobs, so a PR never waits on the Ubuntu package mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    permissions:
      contents: read
    env:
      # renovate: datasource=npm depName=@lhci/cli
      LHCI_VERSION: 0.16.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # setup-bun extracts a zip and the image has no unzip; its Node installs Bun instead.
      - name: Set up Bun
        run: npm install -g bun@1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install chromium
        working-directory: apps/web

      # The specs run against a production build made with the Google Fonts hosts unresolvable, and
      # with a placeholder Umami id whose hosts are unresolvable too, so the marketing pages carry
      # the Umami tag and its policy and nothing reaches Umami. The container runs as root, so
      # /etc/hosts is written directly.
      - name: Block the Google Fonts and Umami hosts
        run: |
          printf "%s fonts.googleapis.com fonts.gstatic.com cloud.umami.is gateway.umami.is\n" 0.0.0.0 :: >> /etc/hosts

      - name: Run the accessibility specs
        env:
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: 00000000-0000-4000-8000-000000000001
        run: bun run --filter '@lumenwipe/web' test:a11y

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Detect web changes
        id: web
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: apps/web
        # The container runs as root on a workspace the runner user owns, so git refuses it unless
        # told otherwise; bash's pipefail turns a refused diff into a failed step, not a silent false.
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          run=$(git -c safe.directory="$GITHUB_WORKSPACE" diff --name-only "origin/${BASE_REF}...HEAD" |
            bun scripts/lighthouse-report.ts gate)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Web app changed: $run"

      - name: Measure with Lighthouse
        id: lighthouse
        if: steps.web.outputs.run == 'true'
        continue-on-error: true
        working-directory: apps/web
        run: |
          CHROME_PATH=$(bun -e 'console.log(require("@playwright/test").chromium.executablePath())')
          export CHROME_PATH
          npx --yes "@lhci/cli@${LHCI_VERSION}" collect
          npx --yes "@lhci/cli@${LHCI_VERSION}" upload

      - name: Summarize the Lighthouse runs
        if: steps.lighthouse.outcome == 'success'
        continue-on-error: true
        working-directory: apps/web
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/lighthouse-report.ts summary lighthouse-report "$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Lighthouse reports
        if: steps.web.outputs.run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: apps/web/lighthouse-report/
          retention-days: 14
          if-no-files-found: warn

  # The web app built the way Vercel builds it: `vercel build --prod`, with Next's build adapter on
  # (NEXT_ENABLE_ADAPTER=1, which Vercel's build machines set), then scripts/marketing-csp.mjs
  # check-output on the result. It proves every prerendered marketing page leaves the build with
  # its hash policy in the Build Output config Vercel serves, and the network and sign-in routes
  # with the proxy's nonce policy, on the real builder rather than `next start`. No token and no
  # pulled settings: a placeholder project file is enough for a local build, and the public build
  # variables are placeholders. Runs on a PR that changes what the web app is built from (the same
  # gate as Lighthouse) and on every push to main. Nothing is deployed.
  web-vercel-build:
    name: web vercel build (adapter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # renovate: datasource=npm depName=vercel
      VERCEL_CLI_VERSION: 65.16.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect web changes
        id: web
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          run=$(git diff --name-only "origin/${BASE_REF}...HEAD" | bun scripts/lighthouse-report.ts gate)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Web app changed: $run"

      # The Vercel builder runs next build too, so it proves the same offline build.
      - name: Block the Google Fonts hosts
        if: github.event_name != 'pull_request' || steps.web.outputs.run == 'true'
        shell: bash
        run: |
          printf "%s fonts.googleapis.com fonts.gstatic.com\n" 0.0.0.0 :: | sudo tee -a /etc/hosts

      - name: Build with the Vercel builder
        if: github.event_name != 'pull_request' || steps.web.outputs.run == 'true'
        env:
          NEXT_ENABLE_ADAPTER: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          VERCEL_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_URL: https://www.lumenwipe.com
          NEXT_PUBLIC_STELLAR_WALLET_CONNECT_PROJECT_ID: 0123456789abcdef0123456789abcdef
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: 00000000-0000-4000-8000-000000000001
        run: |
          mkdir -p .vercel
          echo '{"orgId":"team_ci","projectId":"prj_ci","settings":{"framework":"nextjs","rootDirectory":"apps/web","buildCommand":null,"installCommand":null,"outputDirectory":null,"devCommand":null,"nodeVersion":"24.x"}}' > .vercel/project.json
          bunx "vercel@${VERCEL_CLI_VERSION}" build --prod --yes

      - name: Check the marketing policies in the build output
        if: github.event_name != 'pull_request' || steps.web.outputs.run == 'true'
        working-directory: apps/web
        run: node scripts/marketing-csp.mjs check-output ../../.vercel/output

      - name: Check that an unknown path segment is a routing miss in the build output
        if: github.event_name != 'pull_request' || steps.web.outputs.run == 'true'
        working-directory: apps/web
        run: node scripts/not-found-routing.mjs check-output ../../.vercel/output

  # The same gate for the playground: its own production build, every /api call answered by
  # fixtures in the browser, so no API, no secret and no testnet. A serious or critical violation
  # fails it.
  playground-a11y:
    name: playground accessibility (axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-bun extracts a zip and the image has no unzip; its Node installs Bun instead.
      - name: Set up Bun
        run: npm install -g bun@1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install chromium
        working-directory: apps/playground

      # The specs run against a production build made with the Google Fonts hosts unresolvable.
      # The container runs as root, so /etc/hosts is written directly.
      - name: Block the Google Fonts hosts
        run: |
          printf "%s fonts.googleapis.com fonts.gstatic.com\n" 0.0.0.0 :: >> /etc/hosts

      - name: Run the accessibility specs
        run: bun run --filter '@lumenwipe/playground' test:a11y

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-a11y-report
          path: |
            apps/playground/playwright-report/
            apps/playground/test-results/
          retention-days: 14
          if-no-files-found: warn

  # Formatting is its own required status check (kept separate from the `check` matrix so a
  # style-only failure doesn't get lost inside a package's own type-check/lint/test group).
  prettier:
    name: prettier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

  # Everything above runs from source, so nothing exercises the production image, and two
  # different failures have already shipped through that gap. One breaks the build: a workspace
  # present in bun.lock but never copied into the build context (#135's apps/playground). The
  # other does not: a file that shifts tsc's rootDir relocates the compiled entrypoint (#81),
  # and since stage 3 copies whatever tree the builder emitted, `docker build` exports a green
  # image whose CMD then cannot find dist/main.js. So this job builds AND boots - the build
  # catches the first, /health catches the second. Same flags as deploy-api.yml so this stays
  # the same command; nothing is pushed, deploy-api.yml still builds and pushes the real image.
  #
  # The image is then inventoried and scanned: Syft writes an SPDX SBOM (uploaded as the
  # api-image-sbom artifact) and Grype matches that same SBOM against its vulnerability database,
  # so what was scanned is exactly what was inventoried. scripts/image-scan-gate.ts fails on a high
  # or critical finding that scripts/image-scan-allowlist.json does not cover (a reason and an expiry
  # at most 92 days out, as for the dependency audit). Like the audit, the database moves
  # independently of this repo, so a new advisory can turn this red on an unchanged image, and an
  # unreachable database fails the job.
  docker:
    name: api image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
      SYFT_CHECK_FOR_APP_UPDATE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # Before the build, so an unpinned base or a Bun or Node drift fails in seconds.
      - name: Require digest-pinned bases that agree with .tool-versions
        run: bun scripts/check-image-pins.ts

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build the API image
        run: docker build --platform linux/amd64 --provenance=false --build-arg GIT_SHA="$GITHUB_SHA" -f apps/api/Dockerfile -t lumenwipe-api:ci .

      # The distroless runtime's tag names no Node version and Renovate moves only its digest, so the
      # Node it ships is checked here: it must be exactly the Node in .tool-versions.
      - name: Require the image's Node to be the Node in .tool-versions
        shell: bash
        run: |
          expected="v$(awk '$1 == "nodejs" { print $2 }' .tool-versions)"
          actual="$(docker run --rm lumenwipe-api:ci --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::the image runs Node ${actual}, but .tool-versions pins ${expected}"
            exit 1
          fi
          echo "the image runs Node ${actual}"

      # The startup check (src/config/validate-env.ts) refuses a production boot without API_KEYS
      # and both mainnet endpoints. Boot makes no network calls, so throwaway values and reserved
      # .invalid hosts are enough to reach /health. No route is exercised with them. Container logs
      # are printed on failure - the interesting output is the crash, and it is not visible anywhere
      # else.
      - name: Boot the image and check /health and the commit at /
        run: |
          docker run -d --name api-smoke -e API_KEYS=ci=ci-smoke -e PORT=8080 \
            -e STELLAR_RPC_MAINNET=https://rpc.mainnet.invalid \
            -e PATH_ROUTING_API_MAINNET=https://horizon.mainnet.invalid \
            -p 8080:8080 lumenwipe-api:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "the image never answered /health:"
              docker logs api-smoke
              exit 1
            fi
            sleep 1
          done
          # deploy-api.sh promotes a revision only when / reports the commit it was built from.
          reported="$(curl -fsS http://127.0.0.1:8080/ | jq -r .gitSha)"
          if [ "$reported" != "$GITHUB_SHA" ]; then
            echo "/ reports gitSha ${reported}, expected ${GITHUB_SHA}"
            exit 1
          fi

      - name: Read the Syft and Grype pins
        id: pins
        run: |
          {
            echo "syft-version=$(jq -er .syft.version scripts/security-tools.json)"
            echo "syft-sha256=$(jq -er .syft.linuxSha256 scripts/security-tools.json)"
            echo "grype-version=$(jq -er .grype.version scripts/security-tools.json)"
            echo "grype-sha256=$(jq -er .grype.linuxSha256 scripts/security-tools.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Install Syft
        uses: ./.github/actions/release-binary
        with:
          name: syft
          version: ${{ steps.pins.outputs.syft-version }}
          sha256: ${{ steps.pins.outputs.syft-sha256 }}
          url: https://github.com/anchore/syft/releases/download/v${{ steps.pins.outputs.syft-version }}/syft_${{ steps.pins.outputs.syft-version }}_linux_amd64.tar.gz
          member: syft

      - name: Install Grype
        uses: ./.github/actions/release-binary
        with:
          name: grype
          version: ${{ steps.pins.outputs.grype-version }}
          sha256: ${{ steps.pins.outputs.grype-sha256 }}
          url: https://github.com/anchore/grype/releases/download/v${{ steps.pins.outputs.grype-version }}/grype_${{ steps.pins.outputs.grype-version }}_linux_amd64.tar.gz
          member: grype

      - name: Write the SBOM
        run: |
          mkdir -p image-report
          ./syft scan docker:lumenwipe-api:ci --quiet \
            -o spdx-json=image-report/sbom.spdx.json -o syft-json=image-report/sbom.syft.json

      # One retry: the database host can blip. A real outage still fails both times.
      - name: Fetch the vulnerability database
        run: ./grype db update || { sleep 10; ./grype db update; }

      - name: Scan the SBOM
        run: ./grype sbom:image-report/sbom.syft.json --quiet -o json --file image-report/grype.json

      - name: Fail on a high or critical finding that is not allowlisted
        run: bun scripts/image-scan-gate.ts image-report/grype.json

      - name: Upload the SBOM and the scan report
        if: ${{ always() && hashFiles('image-report/sbom.spdx.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-image-sbom
          path: image-report/
          retention-days: 30
          if-no-files-found: error

  # The version only moves in a release PR (RELEASING.md), so a change to what a published package
  # ships records itself under [Unreleased] instead (scripts/package-release.ts, changelog mode).
  # sdk: packages/sdk/src and, by content, etc/sdk.api.md, which reflects packages/types surface
  # changes too. verify: every file tsup compiles into the bundle (the web's verify.ts and what it
  # imports, the bundled registries), the vectors, the API report, tsup.config.ts and the
  # consumer-visible package.json fields. Skipped on push, which the aggregate gate treats as
  # passing.
  changelog:
    name: changelog (sdk, verify)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Require an [Unreleased] entry when what the SDK ships changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/package-release.ts sdk changelog

      - name: Require an [Unreleased] entry when what the verifier ships changed
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/package-release.ts verify changelog

  # Each published package's version, CHANGELOG.md headings and links (and, for the SDK,
  # SDK_VERSION and the docs pin) must agree with each other, with its tags (sdk-v*, verify-v*) and
  # with npm (scripts/package-release.ts). A merged release that is not on npm yet, or a package
  # whose first release is not cut yet, is only a warning, so no PR waits on a publish; a release
  # PR whose version is already on npm, or not above npm latest or the base branch, fails.
  # Read-only: npm view and git ls-remote, retried.
  release-agreement:
    name: release agreement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Test the release checks
        run: bun test ./scripts/package-release.test.ts

      - name: Check the SDK release agrees with its tags and npm
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/package-release.ts sdk pr

      - name: Check the verifier release agrees with its tags and npm
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/package-release.ts verify pr

  # Findings go to the Security tab and do not fail the job. The repo's CodeQL default setup
  # must stay off, or GitHub rejects this upload as a conflicting configuration.
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - .agents
              - .claude
              - .codex
              - "**/node_modules"

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  # The rule packs are fetched unpinned, so a newly published rule can fail a PR that did not
  # cause it.
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version, rule pack names, flags and targets come from scripts/security-tools.json, which
      # `bun run security:scan` reads too. The packs themselves are fetched live, so two runs on
      # different days can still differ.
      - name: Install Semgrep
        run: pipx install "semgrep==$(jq -er .semgrep.version scripts/security-tools.json)"

      - name: Scan
        run: |
          pins=scripts/security-tools.json
          configs_out="$(jq -er '.semgrep.configs[] | "--config", .' "$pins")"
          flags_out="$(jq -er '.semgrep.flags[]' "$pins")"
          targets_out="$(jq -er '.semgrep.targets[]' "$pins")"
          mapfile -t configs <<< "$configs_out"
          mapfile -t flags <<< "$flags_out"
          mapfile -t targets <<< "$targets_out"
          semgrep scan "${configs[@]}" "${flags[@]}" --error --sarif-output=semgrep.sarif "${targets[@]}"

      - name: Upload results
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Full history, since a deleted key is still exposed. Not gitleaks-action: it needs a paid
  # licence on an organization's repo.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      installed: ${{ steps.install.outputs.installed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Version, checksum, config and log range come from scripts/security-tools.json, shared
      # with `bun run security:scan`. The `installed` output lets the aggregate job tell an install
      # failure apart from a failed scan: it is set only once the pins are read and the binary is
      # restored or downloaded, checked against the pin and extracted.
      - name: Read the gitleaks pins
        id: pins
        run: |
          {
            echo "version=$(jq -er .gitleaks.version scripts/security-tools.json)"
            echo "sha256=$(jq -er .gitleaks.linuxSha256 scripts/security-tools.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Install gitleaks
        uses: ./.github/actions/release-binary
        with:
          name: gitleaks
          version: ${{ steps.pins.outputs.version }}
          sha256: ${{ steps.pins.outputs.sha256 }}
          url: https://github.com/gitleaks/gitleaks/releases/download/v${{ steps.pins.outputs.version }}/gitleaks_${{ steps.pins.outputs.version }}_linux_x64.tar.gz
          member: gitleaks

      - name: Mark gitleaks installed
        id: install
        run: echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: Scan the full history
        run: |
          pins=scripts/security-tools.json
          flags_out="$(jq -er '.gitleaks.flags[]' "$pins")"
          log_opts="$(jq -er .gitleaks.logOpts "$pins")"
          config="$(jq -er .gitleaks.config "$pins")"
          ignore="$(jq -er .gitleaks.ignore "$pins")"
          mapfile -t flags <<< "$flags_out"
          ./gitleaks git --log-opts="$log_opts" --config "$config" --gitleaks-ignore-path "$ignore" \
            "${flags[@]}" .

  # The advisory database moves independently of this repo, so a new high or critical advisory
  # turns this red on an unchanged lockfile. Accepted exceptions live in
  # scripts/audit-allowlist.json with a reason and an expiry; an unreachable endpoint fails the job.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test the audit gate
        run: bun test scripts/audit-gate.test.ts

      - name: Test the Vercel ignore script
        run: bun test scripts/vercel-ignore.test.ts

      - name: Test the error reference check
        run: bun test scripts/check-error-reference.test.ts

      - name: Test the security scan report
        run: bun test scripts/security-scan.test.ts

      - name: Test the download script
        run: bun test scripts/download.test.ts

      - name: Test the release binary install script
        run: bun test scripts/install-release-binary.test.ts

      - name: Test the API deploy script
        run: bun test scripts/deploy-api.test.ts

      - name: Test the migration check
        run: bun test scripts/migration-check.test.ts

      - name: Test the API image pin check
        run: bun test scripts/check-image-pins.test.ts

      - name: Test the API image scan gate
        run: bun test scripts/image-scan-gate.test.ts

      - name: Test the coverage gate
        run: bun test scripts/coverage-gate.test.ts

      - name: Test the funded tier's key boundary
        run: bun test scripts/funded-tier.test.ts

      - name: Audit dependencies
        run: bun run scripts/audit-gate.ts

  # A floating action tag runs whatever its owner retags it to, with this repo's credentials, and
  # a job with no timeout can hold a runner for six hours. actionlint catches workflow errors; the
  # script enforces the two rules it does not: a full-SHA pin with a version comment, and a
  # timeout on every job.
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        uses: ./.github/actions/release-binary
        with:
          name: actionlint
          version: ${{ env.ACTIONLINT_VERSION }}
          sha256: ${{ env.ACTIONLINT_SHA256 }}
          url: https://github.com/rhysd/actionlint/releases/download/v${{ env.ACTIONLINT_VERSION }}/actionlint_${{ env.ACTIONLINT_VERSION }}_linux_amd64.tar.gz
          member: actionlint

      - name: Lint workflows
        run: ./actionlint -color

      - name: Require pinned actions and job timeouts
        run: scripts/check-workflows.sh

  # The docs job runs on a PR only, so nothing on main would ever cache lychee and each docs PR
  # would still fetch it from the release host. This keeps the entry in main's cache, which every PR
  # can read, and does the same for the api image job's Syft and Grype. It is not part of the
  # aggregate gate: a release host outage here only marks this job.
  release-binary-cache:
    name: release binary cache
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache lychee
        uses: ./.github/actions/release-binary
        with:
          name: lychee
          version: ${{ env.LYCHEE_VERSION }}
          sha256: ${{ env.LYCHEE_SHA256 }}
          url: https://github.com/lycheeverse/lychee/releases/download/lychee-v${{ env.LYCHEE_VERSION }}/lychee-x86_64-unknown-linux-gnu.tar.gz
          member: lychee-x86_64-unknown-linux-gnu/lychee
          strip-components: "1"

      - name: Read the Syft and Grype pins
        id: pins
        run: |
          {
            echo "syft-version=$(jq -er .syft.version scripts/security-tools.json)"
            echo "syft-sha256=$(jq -er .syft.linuxSha256 scripts/security-tools.json)"
            echo "grype-version=$(jq -er .grype.version scripts/security-tools.json)"
            echo "grype-sha256=$(jq -er .grype.linuxSha256 scripts/security-tools.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Syft
        uses: ./.github/actions/release-binary
        with:
          name: syft
          version: ${{ steps.pins.outputs.syft-version }}
          sha256: ${{ steps.pins.outputs.syft-sha256 }}
          url: https://github.com/anchore/syft/releases/download/v${{ steps.pins.outputs.syft-version }}/syft_${{ steps.pins.outputs.syft-version }}_linux_amd64.tar.gz
          member: syft

      - name: Cache Grype
        uses: ./.github/actions/release-binary
        with:
          name: grype
          version: ${{ steps.pins.outputs.grype-version }}
          sha256: ${{ steps.pins.outputs.grype-sha256 }}
          url: https://github.com/anchore/grype/releases/download/v${{ steps.pins.outputs.grype-version }}/grype_${{ steps.pins.outputs.grype-version }}_linux_amd64.tar.gz
          member: grype

  # The docs site and the diagrams embedded in it have no other guard: a broken link, a page that
  # never reaches the sidebar, a failing Mintlify build or a diagram edited without re-rendering
  # all ship silently. Only meaningful on a PR (a diff against its base); every step is gated on
  # the changed-files check, so an unrelated PR passes this job without running anything, and
  # a push skips it. The aggregate gate treats skipped as passing. Link checks on third-party
  # sites are reported but never fail the job, since someone else's outage must not block a PR.
  docs:
    name: docs
    # Pinned because the diagram check compares against SVGs rendered by this image's apt Graphviz.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    env:
      MINT_VERSION: 4.2.778
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect docs changes
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD |
            grep -qE '^(docs/|diagrams/|README\.md$|CONTRIBUTING\.md$|scripts/check-(docs-nav\.mjs|diagrams\.sh|error-reference\.mjs)$|apps/api/src/common/error-codes\.ts$|\.github/workflows/ci\.yml$)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "No docs, diagram or docs-tooling change in this PR - nothing to check."
          fi

      - name: Set up Node
        if: steps.changed.outputs.docs == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check every docs page is in the navigation
        if: steps.changed.outputs.docs == 'true'
        run: node scripts/check-docs-nav.mjs

      - name: Check the error reference lists every API error code
        if: steps.changed.outputs.docs == 'true'
        run: node scripts/check-error-reference.mjs

      - name: Check internal docs links
        if: steps.changed.outputs.docs == 'true'
        working-directory: docs
        run: npx --yes "mint@${MINT_VERSION}" broken-links

      - name: Validate the Mintlify build
        if: steps.changed.outputs.docs == 'true'
        working-directory: docs
        run: npx --yes "mint@${MINT_VERSION}" validate

      - name: Install lychee
        if: steps.changed.outputs.docs == 'true'
        uses: ./.github/actions/release-binary
        with:
          name: lychee
          version: ${{ env.LYCHEE_VERSION }}
          sha256: ${{ env.LYCHEE_SHA256 }}
          url: https://github.com/lycheeverse/lychee/releases/download/lychee-v${{ env.LYCHEE_VERSION }}/lychee-x86_64-unknown-linux-gnu.tar.gz
          member: lychee-x86_64-unknown-linux-gnu/lychee
          strip-components: "1"

      - name: Check links in the root documents
        if: steps.changed.outputs.docs == 'true'
        run: ./lychee --offline --no-progress README.md CONTRIBUTING.md

      - name: Report external links
        if: steps.changed.outputs.docs == 'true'
        continue-on-error: true
        run: |
          ./lychee --no-progress --scheme https --max-retries 3 --retry-wait-time 5 --timeout 20 \
            --accept '200..=299,403,429' README.md CONTRIBUTING.md 'docs/**/*.md' 'docs/**/*.mdx'

      - name: Set up Python
        if: steps.changed.outputs.docs == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Check the rendered diagrams match their sources
        if: steps.changed.outputs.docs == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq graphviz
          pip install --quiet graphviz==0.20.3
          scripts/check-diagrams.sh

      - name: Upload the CI-rendered diagrams
        if: ${{ failure() && steps.changed.outputs.docs == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-diagrams
          path: docs/diagrams/output

  # The invariant register, the controller list and a few other claims in the docs name files,
  # symbols and tests. Nothing else notices when a refactor makes one of them untrue, so this
  # job fails the build instead. It needs no install: the script uses only Bun and node:*.
  docs-claims:
    name: docs claims
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Test the docs claim check
        run: bun test ./scripts/check-docs-claims.test.ts

      - name: Check documented claims against the code
        run: bun run check:docs

  # Aggregate gate: keeps the existing required-status-check name so branch
  # protection needs no change. Passes only if every job above passed.
  ci:
    name: type-check · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs:
      [
        check,
        a11y,
        playground-a11y,
        integration,
        integration-funded,
        integration-funded-pr,
        docker,
        prettier,
        changelog,
        release-agreement,
        codeql,
        semgrep,
        gitleaks,
        audit,
        workflow-lint,
        docs,
        docs-claims,
      ]
    if: ${{ always() }}
    steps:
      - name: Verify every check passed
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          GITLEAKS_INSTALLED: ${{ needs.gitleaks.outputs.installed }}
          EVENT_NAME: ${{ github.event_name }}
          FUNDED_RESULT: ${{ needs.integration-funded.result }}
          FUNDED_PR_RESULT: ${{ needs.integration-funded-pr.result }}
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "One or more package checks failed."
            exit 1
          fi
          if [ "${{ needs.a11y.result }}" != "success" ]; then
            echo "The accessibility specs found a serious or critical axe violation or an unreachable control."
            exit 1
          fi
          if [ "${{ needs.playground-a11y.result }}" != "success" ]; then
            echo "The playground accessibility specs found a serious or critical axe violation."
            exit 1
          fi
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "Integration tests against live RPC failed."
            exit 1
          fi
          # Each event runs exactly one funded job; any other result, or an event not listed, fails.
          case "$EVENT_NAME" in
            push) expected_funded=success expected_funded_pr=skipped ;;
            pull_request) expected_funded=skipped expected_funded_pr=success ;;
            *)
              echo "The aggregate gate does not know the $EVENT_NAME event, so it cannot judge the funded tier."
              exit 1
              ;;
          esac
          if [ "$FUNDED_RESULT" != "$expected_funded" ] || [ "$FUNDED_PR_RESULT" != "$expected_funded_pr" ]; then
            echo "Funded integration tests (Phoenix, FxDAO, sponsorship, multisig) failed or did not run as $EVENT_NAME requires."
            exit 1
          fi
          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "The API image failed to build, boot, or pass its pin check or vulnerability scan."
            exit 1
          fi
          if [ "${{ needs.prettier.result }}" != "success" ]; then
            echo "Formatting check failed."
            exit 1
          fi
          if [ "${{ needs.codeql.result }}" != "success" ]; then
            echo "CodeQL analysis failed to run."
            exit 1
          fi
          if [ "${{ needs.semgrep.result }}" != "success" ]; then
            echo "Semgrep reported a finding."
            exit 1
          fi
          if [ "$GITLEAKS_RESULT" != "success" ]; then
            if [ "$GITLEAKS_INSTALLED" != "true" ]; then
              echo "gitleaks could not be installed (download or checksum failed), see the gitleaks job log."
            else
              echo "The gitleaks scan did not pass (a secret was found or the scan errored), see the gitleaks job log."
            fi
            exit 1
          fi
          if [ "${{ needs.audit.result }}" != "success" ]; then
            echo "Dependency audit found a blocking advisory or could not run."
            exit 1
          fi
          if [ "${{ needs.workflow-lint.result }}" != "success" ]; then
            echo "A workflow is unpinned, has no job timeout or fails actionlint."
            exit 1
          fi
          # skipped (not run on a push event) counts as passing for docs too.
          if [ "${{ needs.docs.result }}" != "success" ] && [ "${{ needs.docs.result }}" != "skipped" ]; then
            echo "Docs links, navigation, build or diagrams are broken - see the docs job."
            exit 1
          fi
          if [ "${{ needs.docs-claims.result }}" != "success" ]; then
            echo "A documented claim no longer matches the code - see the docs claims job."
            exit 1
          fi
          # skipped (not run on a push event) counts as passing - only a real failure blocks.
          if [ "${{ needs.changelog.result }}" != "success" ] && [ "${{ needs.changelog.result }}" != "skipped" ]; then
            echo "What the SDK or the verifier ships changed without an [Unreleased] changelog entry - see RELEASING.md."
            exit 1
          fi
          if [ "${{ needs.release-agreement.result }}" != "success" ]; then
            echo "A published package's version, changelog, tags and npm disagree - see the release agreement job."
            exit 1
          fi
          echo "All package checks passed."
