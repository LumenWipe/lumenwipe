name: Publish SDK (npm)

# Triggered by a version tag (sdk-vX.Y.Z) so a publish is always a deliberate, versioned release -
# not a side effect of every merge to main. workflow_dispatch is a manual escape hatch for a
# re-run (e.g. the tag was pushed but the run failed before npm publish completed).
on:
  push:
    tags:
      - "sdk-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing sdk-vX.Y.Z tag to publish from"
        required: true

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for npm provenance attestation
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same gate as CI's sdk matrix entry, run again here since a tag push does not
      # depend on the CI workflow having run against this exact ref.
      - name: Type-check, lint, test
        run: |
          bun run --filter '@lumenwipe/sdk' type-check
          bun run --filter '@lumenwipe/sdk' lint
          bun run --filter '@lumenwipe/sdk' test

      - name: Build SDK types
        run: bun run --filter '@lumenwipe/sdk' build:types

      # `build` below rolls up the API report in --local/auto-fix mode, which would silently
      # rewrite etc/sdk.api.md instead of catching drift. Checking it strictly here, before that
      # rollup runs, is what makes this the same guardrail as CI's sdk matrix - not just the same
      # type-check/lint/test - for a tag that never went through that PR's CI on this exact ref.
      - name: Verify the SDK's public API report matches
        run: bun run --filter '@lumenwipe/sdk' check-api

      - name: Build
        run: bun run --filter '@lumenwipe/sdk' build

      # The tag is the source of truth for what's being published; package.json must agree,
      # or a mismatched dist/version pair could reach the registry silently.
      - name: Verify tag matches package.json version
        working-directory: packages/sdk
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#sdk-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG (version $TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Set up Node for npm publish
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        working-directory: packages/sdk
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
